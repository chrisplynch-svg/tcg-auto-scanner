<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Close-Up Scanner</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #0B1528 !important; color: #ffffff !important; margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .app-container { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; margin-bottom: 8px; position: relative; }
        .title-text { font-size: 15px; font-weight: 700; margin: 0 auto; color: #ffffff; }
        .home-btn { background-color: #1e3a8a; font-size: 11px; padding: 4px 10px; border-radius: 6px; text-decoration: none; color: #ffffff; position: absolute; right: 0; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
        .scan-label { background-color: #16223F; border: 1px dashed #1e3a8a; border-radius: 10px; padding: 8px; text-align: center; cursor: pointer; display: block; }
        .scan-lbl-text { font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px; color: #ffffff; }
        .preview-box { width: 100%; height: 110px; background-color: #0F1A30; border-radius: 6px; border: 1px solid #0b1528; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #6B7280; overflow: hidden; padding: 2px; }
        .preview-box img { width: 100%; height: 100%; object-fit: contain; }
        .display-container { background-color: #131F3B; border: 1px solid rgba(30, 58, 138, 0.4); border-radius: 12px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 8px; min-height: 350px; }
        .scene { perspective: 1000px; width: 220px; height: 308px; margin-bottom: 12px; }
        .c3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .face img { width: 100%; height: 100%; object-fit: contain; }
        .back { transform: rotateY(180deg); }
        .spin-text { font-size: 10px; color: #60A5FA; font-family: monospace; letter-spacing: 0.05em; text-transform: uppercase; background-color: rgba(15, 26, 48, 0.8); padding: 4px 12px; border-radius: 9999px; border: 1px solid rgba(30, 58, 138, 0.5); text-align: center; width: auto; display: inline-block; }
        .action-btn { display: none; width: 100%; background-color: #2563EB; color: #ffffff; font-weight: 700; padding: 12px 0; border-radius: 10px; text-align: center; text-decoration: none; margin-top: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header-area">
            <h1 class="title-text">Trading Card Grading <span style="font-size:11px; font-family:monospace; color:#60A5FA;">v1.1</span></h1>
            <a href="index.html" class="home-btn">🏠 Home</a>
        </header>
        
        <div class="grid-layout">
            <label class="scan-label">
                <span class="scan-lbl-text">Front Preview</span>
                <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="runImg(this,'front')">
                <div id="p-front" class="preview-box">Scan Front</div>
            </label>
            <label class="scan-label">
                <span class="scan-lbl-text">Back Preview</span>
                <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="runImg(this,'back')">
                <div id="p-back" class="preview-box">Scan Back</div>
            </label>
        </div>

        <div class="display-container">
            <div class="scene">
                <div id="spin-1" class="c3d">
                    <div class="face bg-[#1A2A4C]" style="border: 1px solid rgba(59, 130, 246, 0.3);">
                        <img id="m-front" style="display:none; width:100%; height:100%; object-fit:contain;">
                        <p id="lbl-f" style="font-size: 12px; color:#9CA3AF; text-align:center; padding:0 8px;">Scan Front To View Image</p>
                    </div>
                    <div class="face back bg-[#1A2A4C]" style="border: 1px solid rgba(59, 130, 246, 0.3);">
                        <img id="m-back" style="display:none; width:100%; height:100%; object-fit:contain;">
                        <p id="lbl-b" style="font-size: 12px; color:#9CA3AF;">Back Image Missing</p>
                    </div>
                </div>
            </div>
            <div>
                <p class="spin-text">Swipe To Spin Card</p>
            </div>
        </div>

        <a id="btn-go" href="info.html" class="action-btn">🔍 Generate Info Breakdown</a>
    </div>

    <script>
        let f="", b="";
        function runImg(input, face) {
            if (input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = function(e) {
                    const src = e.target.result;
                    document.getElementById(`p-${face}`).innerHTML = `<img src="${src}" style="width:100%; height:100%; object-fit:contain;">`;
                    
                    const m = document.getElementById(`m-${face}`);
                    if(m) {
                        m.src = src;
                        m.style.display = 'block';
                    }
                    
                    if(face==='front') {
                        const lblF = document.getElementById(`lbl-f`);
                        if(lblF) lblF.style.display = 'none';
                        f=src;
                    } else {
                        const lblB = document.getElementById(`lbl-b`);
                        if(lblB) lblB.style.display = 'none';
                        b=src;
                    }
                    
                    localStorage.setItem(`card-${face}`, src);
                    
                    if(f !== "" && b !== "") {
                        const btn = document.getElementById('btn-go');
                        if(btn) btn.style.display = 'block';
                    }
                };
                r.readAsDataURL(input.files[0]);
            }
        }

        // Corrected non-snapping 3D finger gesture engine
        function initSpin(id) {
            const el = document.getElementById(id);
            if (!el) return;

            let startX = 0;
            let currentRot = 0;
            let savedRot = 0;
            let isMoving = false;

            el.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                isMoving = true;
            }, { passive: true });

            el.addEventListener('touchmove', function(e) {
                if (!isMoving) return;
                const deltaX = e.touches[0].clientX - startX;
                currentRot = savedRot + (deltaX * 0.5);
                el.style.transform = "rotateY(" + currentRot + "deg)";
            }, { passive: true });

            el.addEventListener('touchend', function() {
                if (!isMoving) return;
                isMoving = false;
                savedRot = currentRot; // Locks rotation vector on finger release
            });
        }

        // Double trigger layer ensuring script setup fires perfectly
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function() { initSpin('spin-1'); });
        } else {
            initSpin('spin-1');
        }
    </script>
</body>
</html>
