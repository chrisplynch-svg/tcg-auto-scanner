<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Trading Card Grading v1.1 - Scanner Stage</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        .scene { perspective: 1000px; }
        .card-container {
            transform-style: preserve-3d;
            will-change: transform;
            touch-action: none;
        }
        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-[#0a1128] text-white min-h-screen flex flex-col p-4 font-sans select-none selection:bg-transparent">

    <!-- Top Navigation Header -->
    <header class="flex justify-between items-center w-full max-w-md mx-auto mb-4 pt-2">
        <div class="flex items-baseline space-x-1.5">
            <h1 class="text-base font-bold tracking-wide">Trading Card Grading</h1>
            <span class="text-[10px] font-mono text-blue-500 font-bold">v1.1</span>
        </div>
        <div class="flex space-x-2">
            <button class="bg-[#111a36] border border-blue-500/40 text-[10px] px-2.5 py-1 rounded-md text-blue-400 font-semibold flex items-center space-x-1">
                <span>📷</span> <span>Scanner</span>
            </button>
            <a href="index.html" class="bg-[#111a36] border border-slate-800 text-[10px] px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 transition-colors font-semibold flex items-center space-x-1">
                <span>🏠</span> <span>Home</span>
            </a>
        </div>
    </header>

    <!-- Main Workspace Contents -->
    <main class="w-full max-w-md mx-auto flex-1 flex flex-col space-y-4 pb-24">
        
        <!-- Top Dual Preview Panes Grid -->
        <div class="grid grid-cols-2 gap-4 w-full">
            <div class="bg-[#111a36]/80 border border-slate-800 rounded-xl p-3 flex flex-col items-center shadow-lg">
                <span class="text-[11px] text-slate-400 font-medium mb-2">Front Preview</span>
                <div class="w-24 h-32 bg-[#0a1128] rounded-lg overflow-hidden border border-slate-700/50 shadow-inner">
                    <img src="https://pokemontcg.io" alt="Front Preview Asset" class="w-full h-full object-cover">
                </div>
            </div>
            <div class="bg-[#111a36]/80 border border-slate-800 rounded-xl p-3 flex flex-col items-center shadow-lg">
                <span class="text-[11px] text-slate-400 font-medium mb-2">Back Preview</span>
                <div class="w-24 h-32 bg-[#0a1128] rounded-lg overflow-hidden border border-slate-700/50 shadow-inner">
                    <img src="https://pokemontcg.io" alt="Back Preview Asset" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <!-- Major Center 3D Stage Container -->
        <div class="w-full bg-[#111a36]/40 border border-slate-800/80 rounded-2xl p-6 flex flex-col items-center justify-center shadow-2xl relative min-h-[380px]">
            <div class="scene w-52 h-72 relative flex items-center justify-center">
                <div id="card" class="card-container w-full h-full relative cursor-grab active:cursor-grabbing transition-transform duration-75 ease-out">
                    
                    <!-- Card Face Front View -->
                    <div class="card-face absolute inset-0 w-full h-full rounded-xl overflow-hidden shadow-2xl border border-slate-700/40">
                        <img src="https://pokemontcg.io" alt="Card View Front" class="w-full h-full object-cover pointer-events-none">
                    </div>

                    <!-- Card Face Back View -->
                    <div class="card-face card-back absolute inset-0 w-full h-full rounded-xl overflow-hidden shadow-2xl border border-slate-700/40">
                        <img src="https://pokemontcg.io" alt="Card View Back" class="w-full h-full object-cover pointer-events-none">
                    </div>

                </div>
            </div>

            <!-- Bottom Swipe Label Alignment -->
            <div class="mt-6 border-t border-slate-800/80 pt-3 w-full text-center">
                <p class="text-[9px] font-mono tracking-[0.25em] text-blue-400/90 uppercase">
                    SWIPE TO SPIN CARD
                </p>
            </div>

            <!-- Static Identification Label Metrics -->
            <div class="mt-4 text-center space-y-0.5">
                <h2 class="text-sm font-bold tracking-wide text-slate-200">Sentret</h2>
                <p class="text-[11px] text-slate-400">Neo Discovery</p>
                <p class="text-[10px] font-mono text-slate-500">#70/75</p>
            </div>
        </div>
    </main>

    <!-- Bottom Primary Submission Layout Bar -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-[#0a1128]/95 backdrop-blur-md border-t border-slate-900 flex justify-center z-50">
        <a href="info.html" class="w-full max-w-md bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3 px-6 rounded-xl shadow-xl transition-all flex items-center justify-center space-x-2 text-sm tracking-wide text-center">
            <span>🔍</span> <span>Generate Info Breakdown</span>
        </a>
    </div>

    <!-- 3D Rotation Processing Script -->
    <script>
        const card = document.getElementById('card');
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentXRot = 0, currentYRot = 0;

        card.style.transform = `rotateX(${currentXRot}deg) rotateY(${currentYRot}deg)`;

        window.addEventListener('pointerdown', (e) => {
            if (!card.contains(e.target)) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            card.style.transition = 'none';
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            const nextY = currentYRot + (deltaX * 0.65);
            const nextX = currentXRot - (deltaY * 0.65);
            const clampedX = Math.max(-45, Math.min(45, nextX));

            card.style.transform = `rotateX(${clampedX}deg) rotateY(${nextY}deg)`;
        });

        const stopDragging = () => {
            if (!isDragging) return;
            isDragging = false;
            card.style.transition = 'transform 0.4s ease-out';
            
            const transformStr = card.style.transform;
            const xMatch = transformStr.match(/rotateX\(([-\d.]+)deg\)/);
            const yMatch = transformStr.match(/rotateY\(([-\d.]+)deg\)/);
            
            if (xMatch) currentXRot = parseFloat(xMatch);
            if (yMatch) currentYRot = parseFloat(yMatch);
        };
        window.addEventListener('pointerup', stopDragging);
        window.addEventListener('pointercancel', stopDragging);
    </script>
</body>
</html>
