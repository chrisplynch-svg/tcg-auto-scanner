<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Close-Up Scanner</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #0B1528 !important; color: #ffffff !important; margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .app-container { max-width: 440px; margin: 0 auto; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; margin-bottom: 24px; position: relative; }
        .title-text { font-size: 16px; font-weight: 700; margin: 0 auto; color: #ffffff; }
        .home-btn { bg-color: rgba(30, 58, 138, 0.6); background-color: #1e3a8a; font-size: 12px; padding: 6px 12px; border-radius: 8px; text-decoration: none; color: #ffffff; position: absolute; right: 0; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .scan-label { background-color: #16223F; border: 1px dashed #1e3a8a; border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; display: block; }
        .scan-lbl-text { font-size: 12px; font-weight: 700; display: block; margin-bottom: 8px; color: #ffffff; }
        .preview-box { w-full; height: 144px; height: 144px; background-color: #0F1A30; border-radius: 8px; border: 1px solid #0b1528; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6B7280; overflow: hidden; padding: 4px; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .display-container { background-color: #131F3B; border: 1px solid rgba(30, 58, 138, 0.4); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 16px; }
        .scene { perspective: 1000px; width: 160px; height: 224px; margin-bottom: 8px; }
        .c3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.1s ease-out; }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .back { transform: rotateY(180deg); }
        .spin-text { font-size: 10px; color: #60A5FA; font-family: monospace; letter-spacing: 0.05em; text-transform: uppercase; background-color: rgba(15, 26, 48, 0.8); padding: 4px 12px; border-radius: 9999px; border: 1px solid rgba(30, 58, 138, 0.5); }
        .action-btn { display: none; width: 100%; background-color: #2563EB; color: #ffffff; font-weight: 700; py-3; padding: 12px 0; border-radius: 12px; text-align: center; text-decoration: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header-area">
            <h1 class="title-text">Trading Card Grading <span style="font-size:12px; font-family:monospace; color:#60A5FA;">v1.1</span></h1>
            <a href="index.html" class="home-btn">🏠 Home</a>
        </header>
        
        <div class="grid-layout">
            <label class="scan-label">
                <span class="scan-lbl-text">Front Preview</span>
                <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="runImg(this,'front')">
                <div id="p-front" class="preview-box">Scan Front</div>
            </label>
            <label class="scan-label">
                <span class="scan-lbl-text">Back Preview</span>
                <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="runImg(this,'back')">
                <div id="p-back" class="preview-box">Scan Back</div>
            </label>
        </div>

        <div class="display-container">
            <div class="scene">
                <div id="spin-1" class="c3d" data-rot="0">
                    <div class="face bg-[#1A2A4C]" style="border: 1px solid rgba(59, 130, 246, 0.3);"><img id="m-front" style="display:none; width:100%; height:100%; object-fit:cover;"><p id="lbl-f" style="font-size: 12px; color:#9CA3AF; text-align:center; padding:0 8px;">Scan Front To View Image</p></div>
                    <div class="face back bg-[#1A2A4C]" style="border: 1px solid rgba(59, 130, 246, 0.3);"><img id="m-back" style="display:none; width:100%; height:100%; object-fit:cover;"><p style="font-size: 12px; color:#9CA3AF;">Back Image Missing</p></div>
                </div>
            </div>
            <p class="spin-text">Swipe To Spin Card</p>
        </div>

        <a id="btn-go" href="info.html" class="action-btn">🔍 Generate Info Breakdown</a>
    </div>

    <script>
        let f="", b="";
        function runImg(input, face) {
            if (input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = function(e) {
                    const src = e.target.result;
                    document.getElementById(`p-${face}`).innerHTML = `<img src="${src}">`;
                    const m = document.getElementById(`m-${face}`); m.src = src; m.style.display = 'block';
                    if(face==='front') { const lbl = document.getElementById(`lbl-f`); if(lbl) lbl.style.display = 'none'; }
                    if(face==='front') f=src; else b=src;
                    localStorage.setItem(`card-${face}`, src);
                    if(f && b) document.getElementById('btn-go').style.display = 'block';
                }; r.readAsDataURL(input.files[0]);
            }
        }
        function spin(id) {
            const el = document.getElementById(id); if(!el) return;
            let sx = 0, rot = 0;
            el.addEventListener('touchstart', (e) => { sx = e.touches.clientX; rot = parseFloat(el.getAttribute('data-rot')) || 0; }, {passive:true});
            el.addEventListener('touchmove', (e) => { const d = e.touches.clientX - sx; let anonymityRot = rot + (d * 0.6); el.style.transform = `rotateY(${anonymityRot}deg)`; el.setAttribute('data-rot', anonymityRot); }, {passive:true});
        }
        document.addEventListener("DOMContentLoaded", () => { spin('spin-1'); });
    </script>
</body>
</html>
