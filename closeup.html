<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Close-Up Scanner</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0B1528 !important; color: #ffffff !important; margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .scene { perspective: 1000px; width: 220px; height: 308px; margin-bottom: 12px; }
        .c3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.1s ease-out; }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid rgba(59, 130, 246, 0.3); }
        .back { transform: rotateY(180deg); }
    </style>
</head>
<body class="flex justify-center">
    <div class="w-full max-w-[440px] flex flex-col">
        <header class="flex justify-between items-center mt-1 mb-4 relative pb-2 border-b border-blue-900/40">
            <h1 class="text-sm font-bold text-white">Trading Card Grading <span class="text-blue-400 font-mono text-[11px]">v1.1</span></h1>
            <a href="index.html" class="bg-blue-900 text-[11px] px-3 py-1 rounded-md font-bold text-white">🏠 Home</a>
        </header>
        
        <div class="grid grid-cols-2 gap-3 mb-3">
            <label class="bg-[#16223F] border border-dashed border-blue-800 rounded-xl p-3 text-center cursor-pointer block">
                <span class="text-xs font-bold text-white block mb-1">Front Preview</span>
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="runImg(this,'front')">
                <div id="p-front" class="w-full h-[110px] bg-[#0F1A30] rounded-lg flex items-center justify-center text-[10px] text-gray-500 overflow-hidden">Scan Front</div>
            </label>
            <label class="bg-[#16223F] border border-dashed border-blue-800 rounded-xl p-3 text-center cursor-pointer block">
                <span class="text-xs font-bold text-white block mb-1">Back Preview</span>
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="runImg(this,'back')">
                <div id="p-back" class="w-full h-[110px] bg-[#0F1A30] rounded-lg flex items-center justify-center text-[10px] text-gray-500 overflow-hidden">Scan Back</div>
            </label>
        </div>

        <div class="bg-[#131F3B] border border-blue-900/40 rounded-xl p-4 flex flex-col items-center justify-center min-h-[350px] mb-3">
            <div class="scene">
                <div id="spin-1" class="c3d">
                    <div class="face bg-[#1A2A4C]">
                        <img id="m-front" class="hidden w-full h-full object-contain">
                        <p id="lbl-f" class="text-xs text-gray-400 text-center px-2">Scan Front To View Image</p>
                    </div>
                    <div class="face back bg-[#1A2A4C]">
                        <img id="m-back" class="hidden w-full h-full object-contain">
                        <p id="lbl-b" class="text-xs text-gray-400">Back Image Missing</p>
                    </div>
                </div>
            </div>
            <div>
                <p class="text-[10px] text-blue-400 font-mono tracking-widest uppercase bg-[#0F1A30] border border-blue-900/50 px-4 py-1.5 rounded-full selection:bg-transparent">Swipe To Spin Card</p>
            </div>
        </div>

        <a id="btn-go" href="info.html" class="hidden w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl text-center text-sm shadow-lg shadow-blue-950">🔍 Generate Info Breakdown</a>
    </div>

    <script>
        window.addEventListener('load', () => {
            localStorage.removeItem("card-front");
            localStorage.removeItem("card-back");
            initSpin('spin-1');
        });

        function runImg(input, face) {
            if (input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = function(e) {
                    const src = e.target.result;
                    document.getElementById(`p-${face}`).innerHTML = `<img src="${src}" class='w-full h-full object-cover rounded-md'>`;
                    
                    const m = document.getElementById(`m-${face}`);
                    if (m) { m.src = src; m.style.display = 'block'; }
                    
                    const lbl = document.getElementById(face === 'front' ? "lbl-f" : "lbl-b");
                    if (lbl) lbl.style.display = 'none';
                    
                    localStorage.setItem(`card-${face}`, src);

                    if (localStorage.getItem("card-front") && localStorage.getItem("card-back")) {
                        document.getElementById("btn-go").style.display = 'block';
                    }
                };
                r.readAsDataURL(input.files[0]);
            }
        }

        function initSpin(id) {
            const el = document.getElementById(id);
            if (!el) return;
            let startX = 0, currentRot = 0, savedRot = 0, isMoving = false;
            el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; isMoving = true; }, { passive: true });
            el.addEventListener('touchmove', e => {
                if (!isMoving) return;
                const deltaX = e.touches[0].clientX - startX;
                currentRot = savedRot + (deltaX * 0.5);
                el.style.transform = `rotateY(${currentRot}deg)`;
            }, { passive: true });
            el.addEventListener('touchend', () => { if (!isMoving) return; isMoving = false; savedRot = currentRot; });
        }
    </script>
</body>
</html>
