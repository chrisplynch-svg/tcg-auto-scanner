<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Vault</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #0B1528 !important; color: #ffffff !important; margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .app-container { max-width: 440px; margin: 0 auto; text-align: center; }
        .deck-card { background-color: #16223F; border: 1px solid rgba(30, 58, 138, 0.5); border-radius: 12px; padding: 16px; margin-bottom: 12px; text-align: left; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="flex justify-between items-center mb-6">
            <a href="index.html" class="text-blue-400 font-medium">← Home</a>
            <h1 class="text-xl font-bold text-white">🗃️ Collection Vault</h1>
            <button onclick="clearAllDecks()" class="text-xs text-red-400 border border-red-500/30 px-2 py-1 rounded">Clear All</button>
        </header>

        <!-- Dynamic Deck List Container -->
        <main id="vaultContainer">
            <p class="text-gray-400 text-sm mt-8">No saved decks or scanned card batches found.</p>
        </main>

        <!-- Custom Action Key Legend at the Bottom -->
        <footer class="mt-8 p-4 bg-[#111A30] rounded-xl border border-blue-900/40 text-left text-xs">
            <h3 class="font-bold text-blue-400 mb-2 uppercase tracking-wider text-[10px]">Action Key Legend</h3>
            <div class="space-y-1 text-gray-300">
                <p><span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-2"></span>🟢 <strong>The Pull Tier:</strong> Send immediately for grading.</p>
                <p><span class="inline-block w-2 h-2 rounded-full bg-yellow-500 mr-2"></span>🟡 <strong>The Cash Raw Tier:</strong> Sell directly as a raw card.</p>
                <p><span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-2"></span>🔴 <strong>The Binder Tier:</strong> Low-value personal collection.</p>
            </div>
        </footer>
    </div>

    <script>
        // ==========================================
        // 1. DATA CORE: SAVE FUNCTION
        // ==========================================
        /**
         * Saves a 9-Card scan batch or Custom Deck to local storage.
         * @param {string} customName - Name given to this deck/batch.
         * @param {Array} cardsArray - Array of card objects: [{name: "Charizard", rawVal: 45.00, tier: "pull"}]
         */
        function saveDeckToVault(customName, cardsArray) {
            const currentVault = JSON.parse(localStorage.getItem("tcg_saved_decks")) || [];
            
            const newDeckEntry = {
                id: "deck_" + Date.now(),
                deckName: customName || "Scanned Batch #" + (currentVault.length + 1),
                date: new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }),
                cards: cardsArray.slice(0, 9) // Strictly limit to your 9-card page counts
            };
            
            currentVault.unshift(newDeckEntry); // Push newest to the top
            localStorage.setItem("tcg_saved_decks", JSON.stringify(currentVault));
            
            // Refresh display instantly if called while on this screen
            if (document.getElementById("vaultContainer")) {
                displaySavedDecks();
            }
        }

        // ==========================================
        // 2. DISPLAY CORE: UI RENDERING LOOP
        // ==========================================
        document.addEventListener("DOMContentLoaded", displaySavedDecks);

        function displaySavedDecks() {
            const container = document.getElementById("vaultContainer");
            const savedDecks = JSON.parse(localStorage.getItem("tcg_saved_decks")) || [];

            if (savedDecks.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-sm mt-8">No saved decks or scanned card batches found.</p>`;
                return;
            }

            container.innerHTML = ""; // Reset fallback text

            savedDecks.forEach((deck) => {
                let cardsHtml = "";
                
                deck.cards.forEach((card, cardIdx) => {
                    const numberEmojis = ["1️⃣", "2️⃣", "3️⃣", "4️⃣", "5️⃣", "6️⃣", "7️⃣", "8️⃣", "9️⃣"];
                    const emoji = numberEmojis[cardIdx] || "🃏";
                    
                    let statusDot = "🔴";
                    if (card.tier === "pull") statusDot = "🟢";
                    if (card.tier === "cash") statusDot = "🟡";

                    cardsHtml += `
                        <div class="flex justify-between items-center py-1.5 border-b border-white/5 text-sm">
                            <span class="font-medium text-white">${emoji} ${card.name}</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs">${statusDot}</span>
                                <span class="font-mono text-gray-300">$${card.rawVal.toFixed(2)}</span>
                            </div>
                        </div>
                    `;
                });

                const deckBlock = document.createElement("div");
                deckBlock.className = "deck-card";
                deckBlock.innerHTML = `
                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-blue-900/60">
                        <h2 class="font-bold text-blue-400 text-base">${deck.deckName}</h2>
                        <span class="text-xs font-mono text-gray-400">${deck.date}</span>
                    </div>
                    <div class="space-y-1">${cardsHtml}</div>
                `;
                container.appendChild(deckBlock);
            });
        }

        function clearAllDecks() {
            if (confirm("Are you sure you want to permanently empty your Collection Vault?")) {
                localStorage.removeItem("tcg_saved_decks");
                displaySavedDecks();
            }
        }
    </script>
</body>
</html>
