<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Grading Information</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0B1528 !important; color: #ffffff !important; margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .scene { perspective: 1000px; width: 220px; height: 308px; margin-bottom: 12px; }
        .c3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.1s ease-out; }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid rgba(59, 130, 246, 0.3); }
        .back { transform: rotateY(180deg); }
    </style>
</head>
<body class="flex justify-center">
    <div class="w-full max-w-[440px] flex flex-col">
        <header class="flex justify-between items-center mt-1 mb-4 relative pb-2 border-b border-blue-900/40">
            <h1 class="text-sm font-bold text-white">Trading Card Grading <span class="text-blue-400 font-mono text-[11px] block">v1.1</span></h1>
            <div class="flex gap-2">
                <a href="closeup.html" class="bg-blue-900/60 border border-blue-700/40 text-[10px] px-2.5 py-1 rounded-md font-bold text-white">🔍 Scanner</a>
                <a href="index.html" class="bg-blue-950 border border-blue-800 text-[10px] px-2.5 py-1 rounded-md font-bold text-white">🏠 Home</a>
            </div>
        </header>

        <!-- INTERACTIVE 3D SPIN CONTAINER -->
        <div class="bg-[#131F3B] border border-blue-900/40 rounded-xl p-4 flex flex-col items-center justify-center mb-3">
            <div class="scene">
                <div id="spin-2" class="c3d">
                    <div class="face bg-[#1A2A4C]">
                        <img id="i-front" class="w-full h-full object-contain" alt="Front">
                    </div>
                    <div class="face back bg-[#1A2A4C]">
                        <img id="i-back" class="w-full h-full object-contain" alt="Back">
                    </div>
                </div>
            </div>
            <div>
                <p class="text-[10px] text-blue-400 font-mono tracking-widest uppercase bg-[#0F1A30] border border-blue-900/50 px-4 py-1.5 rounded-full selection:bg-transparent">Swipe To Spin Card</p>
            </div>
        </div>

        <!-- TARGET BREAKDOWN TEXT DATA FRAME -->
        <main class="bg-[#131F3B] border border-blue-900/40 rounded-xl p-4 text-left font-medium text-xs space-y-3.5 mb-6">
            <h2 class="font-bold text-green-400 text-sm border-b border-blue-950 pb-2 tracking-wider">THE DEEP-DIVE PRE-GRADING</h2>
            
            <div id="ai-loading-box" class="py-6 text-center text-gray-400 space-y-2">
                <div class="animate-spin inline-block w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full"></div>
                <p class="text-[11px] font-mono tracking-wide">Processing card details with Gemini Flash AI...</p>
            </div>

            <div id="ai-content-payload" class="hidden space-y-3 text-gray-200"></div>
        </main>
    </div>

    <script>
        window.addEventListener("load", () => {
            initSpin('spin-2');
            const f = localStorage.getItem("card-front");
            const b = localStorage.getItem("card-back");
            if(f) document.getElementById("i-front").src = f;
            if(b) document.getElementById("i-back").src = b;
            
            requestAnalysis(f, b);
        });

        function initSpin(id) {
            const el = document.getElementById(id);
            if (!el) return;
            let startX = 0, currentRot = 0, savedRot = 0, isMoving = false;
            el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; isMoving = true; }, { passive: true });
            el.addEventListener('touchmove', e => {
                if (!isMoving) return;
                const deltaX = e.touches[0].clientX - startX;
                currentRot = savedRot + (deltaX * 0.5);
                el.style.transform = `rotateY(${currentRot}deg)`;
            }, { passive: true });
            el.addEventListener('touchend', () => { if (!isMoving) return; isMoving = false; savedRot = currentRot; });
        }

        async function requestAnalysis(frontImg, backImg) {
            const loadingBox = document.getElementById('ai-loading-box');
            const contentBox = document.getElementById('ai-content-payload');
            const apiKey = localStorage.getItem('tcg_auto_scanner_gemini_key');

            // Hardcoded structural layout fallback properties if key config drops
            let data = {
                name: "Raichu Holo", set: "Base Set", number: "#14/102",
                grade: "Gem Mint 10 (Simulated preview)", flaws: "Centering alignment holds 60/40 front variance; borders are crisp.",
                worth: "🟢 Yes", rawVal: "45.00", estVal: "220.00", platformFee: "29.70", totalOut: "60.70", netPay: "159.30",
                pop: "1,245 tracked submissions inside registers.", grader: "PSA Premium Tiers optimized for liquidation speed.",
                liquidity: "🟢 High volume market transaction depth.", auth: "Layer micro-printing matches database criteria.",
                next: "Search for reverse-holo parallel cards across identical card sets."
            };

            if (apiKey && frontImg && backImg) {
                const url = `https://googleapis.com{apiKey}`;
                const prompt = `Analyze trading card fronts and backs. Output your response exactly matching this pattern:
                NAME: [Name] \nSET: [Set] \nNUMBER: [Number] \nGRADE: [Grade] \nFLAWS: [Flaws] \nWORTH: [🟢/🔴 Yes/No] \nRAWVAL: [Raw Value number] \nESTVAL: [Graded Value number]
                Choose realistic values. Calculate platform fee at 13.5% of Graded Value. Outlay = 15.00+14.00+2.00+Fee. Net = Graded Value - Outlay. 
                POP: [Pop Details] \nGRADER: [Grader] \nLIQUIDITY: [🟢/🟡/🔴 Details] \nAUTH: [Details] \nNEXT: [Details]`;

                try {
                    const cleanBase64 = (uri) => uri.split(',')[1];
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: "image/jpeg", data: cleanBase64(frontImg) } },
                                    { inlineData: { mimeType: "image/jpeg", data: cleanBase64(backImg) } }
                                ]
                            }]
                        })
                    });
                    const json = await res.json();
                    const text = json.candidates[0].content.parts[0].text;
                    
                    const extract = (regex, fallback) => { const m = text.match(regex); return m ? m[1].trim() : fallback; };
                    const parsedEst = parseFloat(extract(/ESTVAL:\s*\$?([0-9.]+)/, "220.00"));
                    const fee = (parsedEst * 0.135).toFixed(2);
                    const outlay = (15.00 + 14.00 + 2.00 + parseFloat(fee)).toFixed(2);
                    const net = (parsedEst - parseFloat(outlay)).toFixed(2);

                    data = {
                        name: extract(/NAME:\s*(.+)/, data.name), set: extract(/SET:\s*(.+)/, data.set), number: extract(/NUMBER:\s*(.+)/, data.number),
                        grade: extract(/GRADE:\s*(.+)/, data.grade), flaws: extract(/FLAWS:\s*(.+)/, data.flaws), worth: extract(/WORTH:\s*(.+)/, data.worth),
                        rawVal: parseFloat(extract(/RAWVAL:\s*\$?([0-9.]+)/, data.rawVal)).toFixed(2), estVal: parsedEst.toFixed(2),
                        platformFee: fee, totalOut: outlay, netPay: net,
                        pop: extract(/POP:\s*(.+)/, data.pop), grader: extract(/GRADER:\s*(.+)/, data.grader), liquidity: extract(/LIQUIDITY:\s*(.+)/, data.liquidity),
                        auth: extract(/AUTH:\s*(.+)/, data.auth), next: extract(/NEXT:\s*(.+)/, data.next)
                    };
                } catch(e) { console.error("API Error - Loading defaults:", e); }
            }

            contentBox.innerHTML = `
                <div class="bg-[#0F1A30] border border-blue-900/60 p-3 rounded-xl text-center mb-2">
                    <p class="font-extrabold text-sm text-white tracking-wide">${data.name}</p>
                    <p class="text-xs text-blue-400 font-semibold mt-0.5">${data.set}</p>
                    <p class="text-[10px] text-gray-400 font-mono mt-0.5">${data.number}</p>
                </div>
                <p>📊 <strong>Estimated Grade:</strong> ${data.grade}</p>
                <p>🔍 <strong>Flaws Seen:</strong> ${data.flaws}</p>
                
                <div class="bg-[#0B1528] p-3 rounded-xl border border-blue-950/80 space-y-2">
                    <p class="text-xs font-bold">🟢 <strong>Worth Grading?</strong> ${data.worth}</p>
                    <div class="grid grid-cols-2 gap-2 text-xs border-b border-blue-950 pb-2 text-gray-300">
                        <p>💰 <strong>Raw Value:</strong> $${data.rawVal}</p>
                        <p>📈 <strong>Est. Graded Value:</strong> $${data.estVal}</p>
                    </div>
                    <p class="font-bold text-white tracking-wide pt-1">🧮 Net Profit Math:</p>
                    <ul class="space-y-1.5 pl-3 text-gray-400 font-mono text-[11px]">
