    <script>
        window.addEventListener("load", () => {
            initSpin('spin-2');
            
            // Extract captured image components out of physical memory banks
            const frontData = localStorage.getItem("card-front");
            const backData = localStorage.getItem("card-back");
            
            if(frontData) document.getElementById("i-front").src = frontData;
            if(backData) document.getElementById("i-back").src = backData;
            
            runEvaluation(frontData, backData);
        });

        function initSpin(id) {
            const el = document.getElementById(id);
            if (!el) return;
            let startX = 0, currentRot = 0, savedRot = 0, isMoving = false;
            el.addEventListener('touchstart', e => { startX = e.touches.clientX; isMoving = true; }, { passive: true });
            el.addEventListener('touchmove', e => {
                if (!isMoving) return;
                const deltaX = e.touches.clientX - startX;
                currentRot = savedRot + (deltaX * 0.5);
                el.style.transform = `rotateY(${currentRot}deg)`;
            }, { passive: true });
            el.addEventListener('touchend', () => { if (!isMoving) return; isMoving = false; savedRot = currentRot; });
        }
