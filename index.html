<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PokeGrade Zero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Container (Mobile First) -->
  <div id="app-container">
    
    <!-- HEADER / TOP NAV -->
    <header class="app-header">
      <h1 class="brand-title">PokeGrade<span>Zero</span></h1>
      <button id="master-reset-btn" class="reset-icon-btn" aria-label="Reset Application">🔄</button>
    </header>

    <!-- VIEW 1: DUAL-OPTION HOME SCREEN -->
    <main id="home-view" class="view-panel active">
      <div class="welcome-hero">
        <h2>High-Volume Sorting Blueprint</h2>
        <p>Select your zero-cost scanning workflow to begin.</p>
      </div>
      
      <div class="split-scanner-menu">
        <!-- Option 1: Individual Deep-Dive -->
        <label class="scanner-card" id="btn-closeup">
          <input type="file" accept="image/*" capture="camera" class="native-camera-input" id="input-closeup">
          <div class="card-icon">🔍</div>
          <h3>Close-Up Scanner</h3>
          <p>Deep-dive math evaluation for a single card front & back.</p>
        </label>

        <!-- Option 2: 9-Card High-Volume Page -->
        <label class="scanner-card" id="btn-binder">
          <input type="file" accept="image/*" capture="camera" class="native-camera-input" id="input-binder">
          <div class="card-icon">📱</div>
          <h3>9-Card Binder Page</h3>
          <p>Instant tier sequencing for a full binder sheet layout.</p>
        </label>
      </div>
    </main>

    <!-- VIEW 2: INTERACTIVE STAGE (Hidden by default until upload) -->
    <section id="stage-view" class="view-panel">
      <!-- 3D Card Flip Wrapper -->
      <div class="scene-3d">
        <div class="card-3d" id="interactive-card">
          <div class="card-face card-front">
            <div class="placeholder-art">📸 Tap to Flip Front</div>
          </div>
          <div class="card-face card-back">
            <div class="placeholder-art">🔮 Tap to Flip Back</div>
          </div>
        </div>
      </div>
      <p class="interaction-hint">Swipe or tap the card to flip</p>
    </section>

    <!-- BOTTOM SLIDE-UP SHEET -->
    <div id="dashboard-sheet" class="slide-sheet collapsed">
      <div class="sheet-drag-handle" id="sheet-handle"></div>
      <div class="sheet-content">
        <!-- Dynamic Step 1 or Step 2 templates injection point -->
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
