<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>TCG 3D Showcase v5.0</title>
 <style>
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 background-color: #0b1f3f; 
 color: #ffffff;
 margin: 0; padding: 16px;
 display: flex; flex-direction: column; align-items: center;
 min-height: 100vh; box-sizing: border-box;
 overflow-x: hidden;
 }
 .app-screen {
 width: 100%; max-width: 500px;
 display: flex; flex-direction: column; align-items: center;
 flex-grow: 1; position: relative;
 }
 .hidden { display: none !important; }
 .top-bar {
 width: 100%; display: flex; align-items: center; justify-content: center;
 position: relative; margin-bottom: 16px; min-height: 40px;
 }
 h1 {
 font-size: 1.4rem; color: #ffcb05; margin: 0;
 text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-weight: 800;
 text-transform: uppercase; letter-spacing: 1px; text-align: center;
 }
 .column-container { display: flex; gap: 12px; width: 100%; margin-bottom: 16px; }
 .column { flex: 1; display: flex; flex-direction: column; align-items: center; }
 
 .action-input-btn {
 background-color: #1e3d59; color: #ffcb05; border: 2px solid #ffcb05;
 padding: 10px 4px; font-size: 0.8rem; font-weight: 700; border-radius: 8px;
 cursor: pointer; width: 100%; text-align: center; margin-bottom: 8px; min-height: 40px;
 box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-transform: uppercase;
 }
 .mini-preview-box {
 width: 60px; height: 84px; background-color: rgba(255, 255, 255, 0.05);
 border: 1px dashed rgba(255, 203, 5, 0.4); border-radius: 8px; overflow: hidden;
 display: flex; align-items: center; justify-content: center;
 }
 .mini-preview-box img { width: 100%; height: 100%; object-fit: cover; }
 
 /* 3D CARD WORKSPACE VIEWS: Configures the spatial perspectives for touch mechanics */
 .stage-3d-container {
 width: 100%; height: 320px; perspective: 1000px;
 display: flex; align-items: center; justify-content: center;
 margin: 16px 0; position: relative; touch-action: none;
 }
 .card-3d-wrapper {
 width: 200px; height: 280px; position: relative;
 transform-style: preserve-3d; transition: transform 0.1s ease-out;
 box-shadow: 0 15px 35px rgba(0,0,0,0.6); border-radius: 14px;
 }
 .card-side-face {
 position: absolute; top: 0; left: 0; width: 100%; height: 100%;
 backface-visibility: hidden; border-radius: 14px; overflow: hidden;
 border: 1px solid rgba(255, 253, 240, 0.15);
 }
 .card-face-front {
 background-color: #1e3d59; background-size: cover; background-position: center;
 }
 .card-face-back {
 background-color: #8c1c1c; background-size: cover; background-position: center;
 transform: rotateY(180deg);
 }
 .placeholder-text {
 position: absolute; width: 100%; text-align: center; top: 50%;
 transform: translateY(-50%); font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.4);
 padding: 0 12px; box-sizing: border-box; text-transform: uppercase;
 }
 
 .loading-panel {
 width: 100%; background-color: rgba(255, 253, 240, 0.05); border: 2px dashed #ffcb05;
 border-radius: 12px; padding: 16px; box-sizing: border-box; margin-bottom: 24px;
 display: flex; flex-direction: column; gap: 12px;
 }
 #drawer-search-bar {
 width: 100%; padding: 12px; background-color: #0b1f3f; border: 1px solid rgba(255, 203, 5, 0.5);
 border-radius: 8px; color: #ffffff; font-size: 1rem; box-sizing: border-box;
 }
 .submit-btn {
 background-color: #2ec4b6; color: #0b1f3f; border: none; padding: 16px; font-size: 1.1rem;
 font-weight: 800; border-radius: 14px; cursor: pointer; width: 100%; text-align: center;
 box-shadow: 0 6px 15px rgba(46, 196, 182, 0.4); text-transform: uppercase; margin-top: auto;
 }
 </style>
</head>
<body>
 <div id="scanner-screen" class="app-screen">
 <div class="top-bar">
 <h1>3D Showcase <span style="font-size:0.8rem; color:rgba(255,203,5,0.6);">v5.0</span></h1>
 </div>
 
 <!-- Shrunk row containers with direct url assignment actions -->
 <div class="column-container">
 <div class="column">
 <button class="action-input-btn" onclick="assignImageLink(true)">Link Front</button>
 <div class="mini-preview-box" id="front-mini-view"></div>
 </div>
 <div class="column">
 <button class="action-input-btn" onclick="assignImageLink(false)">Link Back</button>
 <div class="mini-preview-box" id="back-mini-view"></div>
 </div>
 </div>
 
 <!-- NEW 3D STAGE AREA: Touch/Swipe directly on the card to flip it around inside the spatial container -->
 <div class="stage-3d-container" id="interaction-3d-stage">
 <div class="card-3d-wrapper" id="live-3d-card-mesh">
 <div class="card-side-face card-face-front" id="front-3d-canvas">
 <div class="placeholder-text" id="front-txt-node">Front Artwork Missing</div>
 </div>
 <div class="card-side-face card-face-back" id="back-3d-canvas">
 <div class="placeholder-text" id="back-txt-node">Standard Card Back</div>
 </div>
 </div>
 </div>
 
 <div class="loading-panel">
 <div style="font-size: 0.85rem; font-weight: 800; color: #ffcb05; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;">Swipe to Spin Card Front to Back</div>
 <input type="text" id="drawer-search-bar" placeholder="Swipe mesh area or type card query...">
 </div>
 <button class="submit-btn" onclick="alert('3D Mesh Blueprint locked successfully!')">Evaluate 3D Showcase Blueprint</button>
 </div>

 <script>
 let currentRotationY = 0;
 let isDraggingCard = false;
 let startTouchX = 0;
 
 // Secure fallback assets loaded instantly into layout structures
 const standardTcgBack = "https://pokemontcg.io";
 document.getElementById('back-3d-canvas').style.backgroundImage = `url('${standardTcgBack}')`;
 const backTxt = document.getElementById('back-txt-node'); if(backTxt) backTxt.remove();

 window.assignImageLink = function(isFront) {
 const promptText = isFront ? "Paste Front Image Web Link Address:" : "Paste Back Image Web Link Address:";
 const defaultLink = isFront ? "https://pokemontcg.io" : standardTcgBack;
 
 const inboundUrl = prompt(promptText, defaultLink);
 if(inboundUrl && inboundUrl.trim().length > 10) {
 const cleanUrl = inboundUrl.trim();
 if(isFront) {
 document.getElementById('front-3d-canvas').style.backgroundImage = `url('${cleanUrl}')`;
 document.getElementById('front-mini-view').innerHTML = `<img src="${cleanUrl}">`;
 const txtNode = document.getElementById('front-txt-node'); if(txtNode) txtNode.remove();
 } else {
 document.getElementById('back-3d-canvas').style.backgroundImage = `url('${cleanUrl}')`;
 document.getElementById('back-mini-view').innerHTML = `<img src="${cleanUrl}">`;
 }
 }
 };

 // INTERACTIVE 3D TOUCH ENGINE: Translates swiping drag parameters into visual spatial angles
 const touchStage = document.getElementById('interaction-3d-stage');
 const cardMesh = document.getElementById('live-3d-card-mesh');

 touchStage.addEventListener('touchstart', (e) => {
 isDraggingCard = true;
 startTouchX = e.touches[0].clientX;
 });

 touchStage.addEventListener('touchmove', (e) => {
 if (!isDraggingCard) return;
 const currentX = e.touches[0].clientX;
 const movementDeltaX = currentX - startTouchX;
 startTouchX = currentX;
 
 // Adjust values to tweak rotation sensitivity
 currentRotationY += movementDeltaX * 0.6;
 cardMesh.style.transform = `rotateY(${currentRotationY}deg)`;
 });

 touchStage.addEventListener('touchend', () => { isDraggingCard = false; });
 touchStage.addEventListener('touchcancel', () => { isDraggingCard = false; });
 </script>
</body>
</html>
