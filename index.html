<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokeGradeZero Prototype</title>
  <style>
    /* ==========================================================================
       RESET & THEME VARIABLES (Matching User Image Specification)
       ========================================================================== */
    :root {
      --bg-main: #0B1528;
      --bg-surface: #111F38;
      --bg-card: #15243F;
      --bg-mesh-box: #0F1C36;
      --bg-card-inner: #1B2D4A;
      --border-color: #1E325A;
      --border-accent: #23395B;
      --border-mesh: #2D4A77;
      
      --text-main: #FFFFFF;
      --text-muted: #A0AEC0;
      --text-dark: #718096;
      
      --color-gold: #FFCC00;
      --color-teal: #38B2AC;
      --color-green: #48BB78;
      --color-red: #F56565;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Mobile Sandbox Container to replicate iPhone Layout */
    .app-container {
      width: 100%;
      max-width: 430px; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-main);
      padding-bottom: 40px;
    }

    /* ==========================================================================
       HEADER COMPONENT
       ========================================================================== */
    .app-header {
      width: 100%;
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      position: sticky;
      top: 0;
      background-color: var(--bg-main);
      z-index: 100;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .version-text {
      font-size: 14px;
      color: var(--color-gold);
    }

    .header-nav-box {
      display: flex;
      gap: 12px;
    }

    .header-icon-btn {
      background-color: var(--border-color);
      border: none;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: none; /* Controlled dynamically by active screen active classes */
    }

    /* ==========================================================================
       SCREEN MANAGEMENT VIEWS
       ========================================================================== */
    .screen-view {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 20px;
    }

    .screen-view.active {
      display: flex;
    }

    /* ==========================================================================
       SCREEN 1: HOME LAYOUT
       ========================================================================== */
    .home-content {
      margin-top: 60px;
      text-align: center;
      width: 100%;
    }

    .main-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .sub-title {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 40px;
      padding: 0 10px;
    }

    .router-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 4%;
    }

    .router-card {
      background-color: var(--bg-card);
      width: 48%;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-accent);
      align-items: center;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-decoration: none;
    }

    .router-icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .router-card-title {
      color: var(--text-main);
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .router-card-desc {
      color: var(--text-dark);
      font-size: 11px;
      line-height: 14px;
    }

    /* ==========================================================================
       SCANNERS & INTERACTIVE CORE INTERFACES
       ========================================================================== */
    .section-title {
      color: var(--color-gold);
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
      text-align: center;
    }

    .scan-button-row {
      display: flex;
      width: 100%;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .scan-action-btn {
      width: 48%;
      border: 1.5px solid var(--color-gold);
      background: transparent;
      border-radius: 6px;
      padding: 12px 0;
      color: var(--color-gold);
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .preview-row {
      display: flex;
      width: 100%;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .preview-box {
      width: 48%;
      height: 120px;
      border: 2px dashed var(--color-gold);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-mesh-box);
    }

    .preview-text {
      color: var(--text-dark);
      font-size: 13px;
    }

    /* ==========================================================================
       3D SPINNING PERSPECTIVE MESH ENGINE (CSS Version)
       ========================================================================== */
    .mesh-container {
      width: 100%;
      height: 280px;
      background-color: var(--bg-surface);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid var(--border-color);
      perspective: 1000px; /* Essential for mobile 3D space depth */
      position: relative;
      touch-action: none; /* Prevents viewport jumping during structural drags */
    }

    .card-mesh-wrapper {
      width: 170px;
      height: 240px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s linear;
    }

    .card-mesh-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      backface-visibility: hidden; /* Hides reverse layer while flipping execution occurs */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid var(--border-mesh);
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .card-mesh-front {
      background-color: var(--bg-card-inner);
      color: var(--text-muted);
    }

    .card-mesh-back {
      background-color: #1a365d;
      color: var(--color-gold);
      transform: rotateY(180deg);
    }

    .mesh-card-text {
      font-size: 14px;
      font-weight: 500;
    }

    .indicator-text-box {
      width: 100%;
      border: 1.5px dashed var(--color-gold);
      border-radius: 6px;
      padding: 10px 0;
      margin: 15px 0;
      background-color: var(--bg-mesh-box);
    }

    .indicator-text {
      color: var(--color-gold);
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .submit-blueprint-btn {
      width: 100%;
      background-color: var(--color-teal);
      border: none;
      border-radius: 8px;
      padding: 14px 0;
      color: var(--bg-main);
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    /* ==========================================================================
       SCREEN 3: MULTI-SCANNER LAYOUT
       ========================================================================== */
    .full-page-scan-btn {
      width: 100%;
      background-color: var(--border-color);
      border: 1px solid var(--border-mesh);
      border-radius: 8px;
      padding: 14px 0;
      color: var(--text-main);
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .large-camera-placeholder {
      width: 100%;
      height: 200px;
      background-color: var(--bg-mesh-box);
      border-radius: 10px;
      border: 1px solid var(--border-accent);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .text-output-container {
      width: 100%;
      background-color: var(--bg-surface);
      border-radius: 10px;
      padding: 16px;
      border: 1px solid var(--border-color);
    }

    .output-heading {
      color: var(--color-gold);
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .list-text {
      font-family: monospace;
      font-size: 13px;
      margin: 6px 0;
      letter-spacing: -0.3px;
    }

    .key-container {
      margin-top: 20px;
      border-top: 1px dashed var(--border-color);
      padding-top: 15px;
    }

    .key-heading {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .key-row {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 16px;
      margin-bottom: 8px;
    }

    .bold-text {
      color: var(--text-main);
      font-weight: bold;
    }

    /* ==========================================================================
       SCREEN 4: DEEP-DIVE BLUEPRINT DATA INTERFACE
       ========================================================================== */
    .blueprint-main-header {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .blueprint-data-card {
      width: 100%;
      background-color: var(--bg-surface);
