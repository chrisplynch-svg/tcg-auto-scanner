<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D SHOWCASE v5.1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1f3f; /* Deep Blue Background */
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    /* Top Title Header */
    .app-header {
      margin-top: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .app-title {
      color: #e6b800; /* Yellow Gold */
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .app-version {
      color: #8fa3c7;
      font-size: 14px;
      font-weight: normal;
      text-transform: lowercase;
    }

    /* Scanner Grid Layout */
    .scan-controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      margin-bottom: 40px;
    }

    .scan-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Gold Buttons from your image */
    .scan-btn {
      width: 100%;
      background: transparent;
      border: 2px solid #e6b800;
      color: #e6b800;
      padding: 12px 6px;
      font-weight: bold;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Yellow Dashed Preview Boxes */
    .preview-box {
      width: 85px;
      height: 120px;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-placeholder {
      font-size: 11px;
      color: #4a628a;
      text-align: center;
      line-height: 1.4;
    }

    /* Center 3D Card Display Container */
    .mesh-view-stage {
      flex-grow: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      margin-bottom: 40px;
    }

    .card-3d-wrapper {
      width: 210px;
      height: 295px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      cursor: grab;
      touch-action: none;
    }

    /* Blue Translucent Card Body */
    .card-side {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(25, 48, 84, 0.7), rgba(15, 32, 60, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .card-side img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      border-radius: 14px;
    }

    .card-front {
      transform: rotateY(0deg);
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .card-side-placeholder {
      color: #4a628a;
      font-size: 13px;
      text-align: center;
      padding: 24px;
      line-height: 1.5;
    }

    /* Yellow Dashed Instructional Footer Bar */
    .instruction-overlay {
      width: 100%;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      margin-bottom: 25px;
      background-color: rgba(230, 184, 0, 0.02);
    }

    .instruction-text {
      color: #e6b800;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Fixed Teal Bottom Panel Action Button */
    .bottom-action-anchor {
      width: 100%;
      margin-top: auto;
    }

    .evaluate-btn {
      width: 100%;
      background-color: #2ec4b6; /* Teal Bright Accent */
      border: none;
      color: #0b1f3f;
      padding: 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .hidden-camera-input {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <h1 class="app-title">3D SHOWCASE <span class="app-version">v5.1</span></h1>
    </header>

    <section class="scan-controls-grid">
      <div class="scan-column">
        <button class="scan-btn" onclick="triggerCamera('front')">Scan Front</button>
        <div class="preview-box" id="preview-front">
          <div class="preview-placeholder">Front<br>Preview</div>
        </div>
      </div>
      
      <div class="scan-column">
        <button class="scan-btn" onclick="triggerCamera('back')">Scan Back</button>
        <div class="preview-box" id="preview-back">
          <div class="preview-placeholder">Back<br>Preview</div>
        </div>
      </div>
    </section>

    <!-- Camera trigger mechanisms with fixed upload handlers -->
    <input type="file" id="input-front" class="hidden-camera-input" accept="image/*" capture="environment" onchange="handleImageUpload(this, 'front')">
    <input type="file" id="input-back" class="hidden-camera-input" accept="image/*" capture="environment" onchange="handleImageUpload(this, 'back')">

    <main class="mesh-view-stage" id="mesh-stage">
      <div class="card-3d-wrapper" id="card-mesh">
        
        <div class="card-side card-front" id="mesh-front-side">
          <div class="card-side-placeholder">Scan Front to View Image</div>
        </div>
        
        <div class="card-side card-back" id="mesh-back-side">
          <div class="card-side-placeholder">Scan Back to View Image</div>
        </div>
        
      </div>
    </main>

    <div class="instruction-overlay">
      <p class="instruction-text">Swipe card mesh area to spin in 3D</p>
    </div>

    <footer class="bottom-action-anchor">
      <button class="evaluate-btn">Evaluate 3D Showcase Blueprint</button>
    </footer>

  </div>

  <script>
    let currentRotationY = 0;
    let isDragging = false;
    let startX = 0;

    const cardMesh = document.getElementById('card-mesh');
    const meshStage = document.getElementById('mesh-stage');

    // Forces mobile phone native camera app sequence open
    function triggerCamera(side) {
      const inputField = document.getElementById(`input-${side}`);
      if(inputField) {
        inputField.value = ''; // Resets field state so you can take multiple shots back-to-back
        inputField.click();
      }
    }

    // Handles processing the image safely onto the cards
    function handleImageUpload(input, side) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        
        reader.onload = function(e) {
          const imageSrc = e.target.result;
          
          // 1. Populates image inside the corresponding small dashed box element
          const previewBox = document.getElementById(`preview-${side}`);
          if(previewBox) {
            previewBox.innerHTML = `<img src="${imageSrc}" alt="${side} preview">`;
          }
          
          // 2. Replaces placeholder text and paints image onto the 3D card layout face directly
          const meshSide = document.getElementById(`mesh-${side}-side`);
          if(meshSide) {
            meshSide.innerHTML = `<img src="${imageSrc}" alt="${side} card surface">`;
          }
        };
        
        reader.readAsDataURL(file);
      }
    }

    // Touch and Gesture Interaction Script for smooth 3D spinning
    function startDrag(e) {
      isDragging = true;
      startX = e.pageX || (e.touches && e.touches[0].pageX);
    }

    function moveDrag(e) {
      if (!isDragging) return;
      
      const currentX = e.pageX || (e.touches && e.touches[0].pageX);
      const deltaX = currentX - startX;
      
      currentRotationY += deltaX * 0.7; // Speed factor of the card spin rotation
      cardMesh.style.transform = `rotateY(${currentRotationY}deg)`;
      
      startX = currentX;
    }

    function endDrag() {
      isDragging = false;
    }

    // Event binding targets
    meshStage.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    meshStage.addEventListener('touchstart', startDrag, { passive: true });
    window.addEventListener('touchmove', moveDrag, { passive: true });
    window.addEventListener('touchend', endDrag);
  </script>
</body>
</html>
