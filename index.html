<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D SHOWCASE v6.2</title>
  <style>
    /* Reset & Theme Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1f3f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      position: relative;
    }

    /* Fixed Layout Header Title */
    .app-header {
      margin-top: 5px;
      margin-bottom: 20px;
      text-align: center;
      width: 100%;
    }

    .app-title {
      color: #e6b800;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .app-version {
      color: #8fa3c7;
      font-size: 14px;
      font-weight: normal;
      text-transform: lowercase;
    }

    /* Airtight Sliding Viewport Wrapper Window Layout */
    .viewport-slider-window {
      width: 100%;
      display: flex;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      flex-grow: 1;
    }

    /* Individual Screen States */
    .view-screen {
      min-width: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    /* Scanner Workspaces Row Configuration Grid */
    .scan-controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      margin-bottom: 25px;
    }

    .scan-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
    }

    /* Golden Action Framing Buttons */
    .scan-btn {
      width: 100%;
      background: transparent;
      border: 2px solid #e6b800;
      color: #e6b800;
      padding: 12px 6px;
      font-weight: bold;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      pointer-events: none;
    }

    /* Un-interrupted Camera Overlay Inputs */
    .camera-trigger-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 45px;
      opacity: 0;
      cursor: pointer;
      -webkit-appearance: none;
      z-index: 50;
    }

    .camera-trigger-overlay:active + .scan-btn {
      background: rgba(230, 184, 0, 0.1);
    }

    /* Preview Track Windows */
    .preview-box {
      width: 85px;
      height: 120px;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-placeholder {
      font-size: 11px;
      color: #4a628a;
      text-align: center;
      line-height: 1.4;
    }

    /* High Precision 3D Visual Mesh Canvas Container Stage */
    .mesh-view-stage {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      margin-bottom: 25px;
      min-height: 310px;
    }

    .card-3d-wrapper {
      width: 210px;
      height: 295px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      cursor: grab;
      touch-action: none;
      z-index: 5;
    }

    .card-side {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(25, 48, 84, 0.7), rgba(15, 32, 60, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .card-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }

    .card-front {
      transform: rotateY(0deg);
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .wireframe-blueprint {
      width: 85%;
      height: 85%;
      border: 1px dashed rgba(230, 184, 0, 0.25);
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .wireframe-blueprint::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 50%;
      border: 1px dashed rgba(230, 184, 0, 0.15);
      border-radius: 4px;
    }

    .wireframe-text {
      color: rgba(230, 184, 0, 0.4);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 60px;
      text-align: center;
      line-height: 1.4;
    }

    .instruction-overlay {
      width: 100%;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      margin-bottom: 95px;
      background-color: rgba(230, 184, 0, 0.02);
    }

    .instruction-text {
      color: #e6b800;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Screen 2 Presentation Elements Architecture */
    .card-identity-header {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
      padding: 4px 0;
    }

    .card-identity-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* Restored Back Button styling on Screen 2 */
    .back-nav-btn {
      align-self: flex-start;
      background: transparent;
      border: 1px solid rgba(230, 184, 0, 0.5);
      color: #e6b800;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .back-nav-btn:active {
      background: rgba(230, 184, 0, 0.1);
    }

    .dashboard-scroll-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 110px; 
    }

    .dashboard-panel-box {
      background: linear-gradient(180deg, #112647 0%, #0a1832 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
    }

    .panel-box-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #e6b800;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .panel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .panel-row:last-child {
      border-bottom: none;
    }

    .panel-label {
      color: #9cb3d9;
    }

    .panel-value {
      font-weight: bold;
      color: #ffffff;
    }

    .math-total-row {
      margin-top: 12px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 800;
    }

    /* Fixed Action Button bar */
    .bottom-action-anchor {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    .evaluate-btn {
      width: 100%;
      max-width: 420px;
      background-color: #2ec4b6;
      border: none;
      color: #0b1f3f;
      padding: 18px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -4px 20px rgba(46, 196, 182, 0.25);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Permanent Header Anchored to Top -->
    <header class="app-header">
      <h1 class="app-title">3D SHOWCASE <span class="app-version">v6.2</span></h1>
    </header>

    <!-- Slide Window Wrapper Block -->
    <div class="viewport-slider-window" id="app-viewport-slider">
      
      <!-- SCREEN 1: SCANNER WORKSPACE VIEW -->
      <div id="screen-showcase" class="view-screen">
        <section class="scan-controls-grid">
          <div class="scan-column">
            <button class="scan-btn">Scan Front</button>
            <input type="file" class="camera-trigger-overlay" accept="image/*" onchange="handleImageUpload(this, 'front')">
            <div class="preview-box" id="preview-front">
              <div class="preview-placeholder">Front<br>Preview</div>
            </div>
          </div>
          
          <div class="scan-column">
            <button class="scan-btn">Scan Back</button>
            <input type="file" class="camera-trigger-overlay" accept="image/*" onchange="handleImageUpload(this, 'back')">
            <div class="preview-box" id="preview-back">
              <div class="preview-placeholder">Back<br>Preview</div>
            </div>
          </div>
        </section>

        <main class="mesh-view-stage" id="global-canvas-stage">
          <div class="card-3d-wrapper" id="card-mesh">
