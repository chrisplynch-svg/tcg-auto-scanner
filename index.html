<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Card Grading v1.1</title>
    <style>
        body { 
            background-color: #0B1528 !important; 
            color: #ffffff !important; 
            margin: 0; 
            padding: 16px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex;
            justify-content: center;
            min-height: 95vh;
        }
        .app-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            margin-top: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            color: #ffffff;
            letter-spacing: -0.03em;
        }
        .version {
            font-size: 13px;
            font-family: monospace;
            color: #60A5FA;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .menu-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
            justify-content: center;
            margin-bottom: 24px;
        }
        .router-card {
            display: block;
            text-align: left;
            background-color: #16223F;
            border: 1px solid rgba(30, 58, 138, 0.4);
            padding: 24px 20px;
            border-radius: 20px;
            text-decoration: none;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .router-card:active {
            transform: scale(0.97);
        }
        .router-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }
        .router-desc {
            font-size: 12px;
            color: #9CA3AF;
            margin-top: 6px;
            line-height: 1.4;
        }
        .status-box {
            background-color: #131F3B;
            border: 1px solid rgba(30, 58, 138, 0.3);
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            margin-top: auto;
            margin-bottom: 10px;
        }
        .status-label {
            font-size: 10px;
            font-weight: 700;
            color: #60A5FA;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 6px;
        }
        .vault-input-group {
            display: flex;
            gap: 8px;
        }
        .vault-input {
            background-color: #0F1A30;
            border: 1px solid rgba(30, 58, 138, 0.5);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11px;
            color: #ffffff;
            font-family: monospace;
            width: 70%;
        }
        .vault-btn {
            background-color: #10B981;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .status-text {
            font-size: 10px;
            color: #9CA3AF;
            margin: 4px 0 0 0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- APP TITLE -->
        <header>
            <h1>Trading Card Grading</h1>
            <div class="version">v1.1</div>
        </header>

        <!-- NAVIGATION ROUTERS STACK -->
        <nav class="menu-stack">
            <!-- ROUTER 1 -->
            <a href="closeup.html" class="router-card">
                <div class="router-title">🟢 Close-Up Scanner</div>
                <div class="router-desc">Deep-dive math evaluation for individual cards.</div>
            </a>

            <!-- ROUTER 2 -->
            <a href="multiple.html" class="router-card">
                <div class="router-title">📑 9-Card Page</div>
                <div class="router-desc">Instant sorting tiers & sequence layout mapping.</div>
            </a>

            <!-- ROUTER 3: NEW COLLECTION DECK HUD -->
            <a href="decks.html" class="router-card" style="border-color: rgba(16, 185, 129, 0.4);">
                <div class="router-title" style="color: #10B981;">🏆 Collection Vault</div>
                <div class="router-desc">Browse your growing single card decks and page archives.</div>
            </a>
        </nav>

        <!-- VAULT CORE SYSTEM INPUT -->
        <div class="status-box">
            <span class="status-label">🔑 System Vault Configuration</span>
            <div class="vault-input-group">
                <input type="password" id="key-vault" placeholder="Paste AQ.Ab8RN... Key Here" class="vault-input">
                <button onclick="lockKey()" class="vault-btn">Save</button>
            </div>
            <p id="key-status" class="status-text">Checking device memory banks...</p>
        </div>
    </div>

    <script>
        const keyName = 'tcg_auto_scanner_gemini_key';
        window.addEventListener('load', () => {
            const cachedKey = localStorage.getItem(keyName);
            if (cachedKey) {
                document.getElementById('key-vault').value = cachedKey;
                updateStatus(true);
            } else { updateStatus(false); }
        });
        function lockKey() {
            const val = document.getElementById('key-vault').value.trim();
            if (val) { localStorage.setItem(keyName, val); updateStatus(true); } 
            else { localStorage.removeItem(keyName); updateStatus(false); }
        }
        function updateStatus(active) {
            const el = document.getElementById('key-status');
            if (el) {
                if (active) { 
                    el.textContent = "🟢 Key loaded securely on your iPhone."; 
                    el.style.color = "#34D399";
                } else { 
                    el.textContent = "🔴 Key missing. Information slots will load simulation fallbacks."; 
                    el.style.color = "#F59E0B";
                }
            }
        }
    </script>
</body>
</html>
