<!DOCTYPEDOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG 3D Showcase v5.1</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b1f3f;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .app-screen {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            position: relative;
        }

        .hidden { display: none !important; }

        .top-bar {
            width: 100%;
            display: flex;
            align-items: center;
            position: relative;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            color: #ffcb05;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .column-container {
            display: flex;
            gap: 16px;
            width: 100%;
            margin-bottom: 16px;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* PREMIUM THEMED CAMERA LABELS: Formatted */
        .camera-input-label {
            display: block;
            width: 100%;
            background-color: #2ec4b6;
            color: #0b1f3f;
            font-weight: 800;
            padding: 12px 4px;
            font-size: 0.8rem;
            font-top-align: center; /* Preserved text-align fallback logic from screenshot */
            text-align: center;
            margin-bottom: 12px;
            border-radius: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-shadow: none;
            line-height: 18px;
            cursor: pointer;
        }

        .camera-input-label:active {
            background-color: #24a195;
        }

        .hidden-system-input {
            display: none;
        }

        .mini-preview-box {
            width: 64px;
            height: 90px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 5, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
        }

        /* 3D CANVAS MATRIX ASSEMBLY */
        .stage-3d-container {
            width: 100%;
            height: 320px;
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px 0;
            position: relative;
            touch-action: none;
        }

        .card-3d-wrapper {
            width: 200px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border-radius: 12px;
        }

        .card-side-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 1px solid rgba(255, 253, 240, 0.15);
            background-color: #1a2a44;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-face-front {
            /* Blends empty slate canvas background pattern colors */
            background-color: #1a2a44;
        }

        .card-face-back {
            transform: rotateY(180deg);
            background-color: #5c1d1d; /* Fallback iconic card back coloring */
        }

        .placeholder-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            padding: 0 12px;
            box-sizing: border-box;
        }

        .loading-panel {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .submit-btn {
            background-color: #2ec4b6;
            color: #0b1f3f;
            font-weight: 800;
            border-radius: 14px;
            border: none;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(46, 196, 182, 0.3);
            text-align: center;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: #24a195;
        }
    </style>
</head>
<body>

    <div id="scanner-screen" class="app-screen">
        <div class="top-bar">
            <h1>3D Showcase <span style="font-size:0.8rem; color: #fff; font-weight:normal;">v5.1</span></h1>
        </div>

        <div class="column-container">
            <div class="column">
                <label class="camera-input-label" for="front-camera-file">SCAN FRONT</label>
                <input type="file" accept="image/*" id="front-camera-file" class="hidden-system-input" onchange="projectCameraToMesh(this, true)">
                <div class="mini-preview-box" id="front-mini-view"></div>
            </div>
            
            <div class="column">
                <label class="camera-input-label" for="back-camera-file">SCAN BACK</label>
                <input type="file" accept="image/*" id="back-camera-file" class="hidden-system-input" onchange="projectCameraToMesh(this, false)">
                <div class="mini-preview-box" id="back-mini-view"></div>
            </div>
        </div>

        <!-- THE INTERACTIVE 3D STAGE MODULE -->
        <div class="stage-3d-container" id="interactive-stage">
            <div class="card-3d-wrapper" id="live-3d-card">
                
                <div class="card-side-face card-face-front" id="front-3d-canvas">
                    <div class="placeholder-text" id="front-text-prompt">Front Camera View Empty</div>
                </div>
                
                <div class="card-side-face card-face-back" id="back-3d-canvas">
                    <div class="placeholder-text" id="back-text-prompt">Back Camera View Empty</div>
                </div>

            </div>
        </div>

        <div class="loading-panel">
            <div style="font-size: 0.85rem; font-weight: bold; text-align: center; color: #ffcb05;">
                READY TO VERIFY
            </div>
            <button class="submit-btn" onclick="alert('Submission system mapping successfully initialized!')">
                COMMIT ASSET PIPELINE
            </button>
        </div>
    </div>

    <script>
        let currentRotationY = 0;
        let isDraggingCard = false;
        let startTouchX = 0;

        // SECURE PIPELINE METHOD: FileReader texture processing engine
        function projectCameraToMesh(inputNode, isFrontMaterial) {
            try {
                if (inputNode.files && inputNode.files[0]) {
                    const rawImageFile = inputNode.files[0];

                    const encoder = new FileReader();
                    encoder.onload = function(event) {
                        try {
                            const secureBase64String = event.target.result;

                            if (isFrontMaterial) {
                                // Projects image directly onto the large canvas mesh and mini preview component
                                document.getElementById('front-3d-canvas').style.backgroundImage = `url(${secureBase64String})`;
                                document.getElementById('front-mini-view').style.backgroundImage = `url(${secureBase64String})`;
                                const textNode = document.getElementById('front-text-prompt');
                                if(textNode) textNode.classList.add('hidden');
                            } else {
                                // Projects image directly onto the large canvas back mesh and mini preview component
                                document.getElementById('back-3d-canvas').style.backgroundImage = `url(${secureBase64String})`;
                                document.getElementById('back-mini-view').style.backgroundImage = `url(${secureBase64String})`;
                                const textNode = document.getElementById('back-text-prompt');
                                if(textNode) textNode.classList.add('hidden');
                            }
                        } catch (renderErr) {
                            console.error("Render error: " + renderErr);
                        }
                    };
                    encoder.readAsDataURL(rawImageFile);
                }
            } catch (err) {
                console.error("Input processing error: " + err);
            }
        }

        // INTERACTIVE 3D TOUCH HANDLING ENGINE
        const touchStage = document.getElementById('interactive-stage');
        const cardMesh = document.getElementById('live-3d-card');

        touchStage.addEventListener('touchstart', (e) => {
            isDraggingCard = true;
