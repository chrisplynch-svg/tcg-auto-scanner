<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>TCG 3D Showcase v5.1</title>
 <style>
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 background-color: #0b1f3f; 
 color: #ffffff;
 margin: 0; padding: 16px;
 display: flex; flex-direction: column; align-items: center;
 min-height: 100vh; box-sizing: border-box;
 overflow-x: hidden;
 }
 .app-screen {
 width: 100%; max-width: 500px;
 display: flex; flex-direction: column; align-items: center;
 flex-grow: 1; position: relative;
 }
 .hidden { display: none !important; }
 .top-bar {
 width: 100%; display: flex; align-items: center; justify-content: center;
 position: relative; margin-bottom: 16px; min-height: 40px;
 }
 h1 {
 font-size: 1.4rem; color: #ffcb05; margin: 0;
 text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-weight: 800;
 text-transform: uppercase; letter-spacing: 1px; text-align: center;
 }
 .column-container { display: flex; gap: 16px; width: 100%; margin-bottom: 16px; }
 .column { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
 
 /* PREMIUM THEMED CAMERA LABELS: Formatted to work securely with iOS gesture systems */
 .camera-input-label {
 display: block; width: 100%; background-color: #1e3d59; color: #ffcb05; border: 2px solid #ffcb05;
 padding: 12px 4px; font-size: 0.8rem; font-weight: 700; border-radius: 10px;
 text-align: center; margin-bottom: 12px; min-height: 44px; box-sizing: border-box;
 box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-transform: uppercase; cursor: pointer;
 line-height: 18px;
 }
 .camera-input-label:active { background-color: #ffcb05; color: #0b1f3f; }
 .hidden-system-input { display: none; }
 
 .mini-preview-box {
 width: 64px; height: 90px; background-color: rgba(255, 255, 255, 0.05);
 border: 2px dashed rgba(255, 203, 5, 0.3); border-radius: 10px; overflow: hidden;
 display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
 }
 .mini-preview-box img { width: 100%; height: 100%; object-fit: cover; }
 
 /* 3D CANVAS MATRIX ASSEMBLY */
 .stage-3d-container {
 width: 100%; height: 320px; perspective: 1000px;
 display: flex; align-items: center; justify-content: center;
 margin: 12px 0; position: relative; touch-action: none;
 }
 .card-3d-wrapper {
 width: 200px; height: 280px; position: relative;
 transform-style: preserve-3d; transition: transform 0.05s ease-out;
 box-shadow: 0 15px 40px rgba(0,0,0,0.6); border-radius: 14px;
 }
 .card-side-face {
 position: absolute; top: 0; left: 0; width: 100%; height: 100%;
 backface-visibility: hidden; border-radius: 14px; overflow: hidden;
 border: 1px solid rgba(255, 253, 240, 0.15);
 background-color: #1a2a44; background-size: cover; background-position: center;
 }
 .card-face-front { /* Blends empty slate canvas */ }
 .card-face-back { transform: rotateY(180deg); }
 
 .placeholder-text {
 position: absolute; width: 100%; text-align: center; top: 50%;
 transform: translateY(-50%); font-size: 0.75rem; font-weight: 800; color: rgba(255,203,5,0.4);
 padding: 0 12px; box-sizing: border-box; text-transform: uppercase; letter-spacing: 0.5px;
 }
 
 .loading-panel {
 width: 100%; background-color: rgba(255, 253, 240, 0.05); border: 2px dashed #ffcb05;
 border-radius: 12px; padding: 16px; box-sizing: border-box; margin-bottom: 24px;
 display: flex; flex-direction: column; gap: 12px;
 }
 .submit-btn {
 background-color: #2ec4b6; color: #0b1f3f; border: none; padding: 16px; font-size: 1.1rem;
 font-weight: 800; border-radius: 14px; cursor: pointer; width: 100%; text-align: center;
 box-shadow: 0 6px 15px rgba(46, 196, 182, 0.4); text-transform: uppercase; margin-top: auto;
 }
 </style>
</head>
<body>
 <div id="scanner-screen" class="app-screen">
 <div class="top-bar">
 <h1>3D Showcase <span style="font-size:0.8rem; color:rgba(255,203,5,0.6);">v5.1</span></h1>
 </div>
 
 <div class="column-container">
 <div class="column">
 <label class="camera-input-label" for="front-camera-file">Scan Front</label>
 <input type="file" id="front-camera-file" class="hidden-system-input" accept="image/*" onchange="projectCameraToMesh(this, true)">
 <div class="mini-preview-box" id="front-mini-view"></div>
 </div>
 <div class="column">
 <label class="camera-input-label" for="back-camera-file">Scan Back</label>
 <input type="file" id="back-camera-file" class="hidden-system-input" accept="image/*" onchange="projectCameraToMesh(this, false)">
 <div class="mini-preview-box" id="back-mini-view"></div>
 </div>
 </div>
 
 <!-- THE INTERACTIVE 3D STAGE MODULE -->
 <div class="stage-3d-container" id="interaction-3d-stage">
 <div class="card-3d-wrapper" id="live-3d-card-mesh">
 <div class="card-side-face card-face-front" id="front-3d-canvas">
  <div class="placeholder-text" id="front-txt-node">Front Image Empty</div>
 </div>
 <div class="card-side-face card-face-back" id="back-3d-canvas">
  <div class="placeholder-text" id="back-txt-node">Back Image Empty</div>
 </div>
 </div>
 </div>
 
 <div class="loading-panel">
 <div style="font-size: 0.85rem; font-weight: 800; color: #ffcb05; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;">Swipe card mesh area to spin in 3D</div>
 </div>
 <button class="submit-btn" onclick="alert('3D Live Mesh Blueprint locked successfully!')">Evaluate 3D Showcase Blueprint</button>
 </div>

 <script>
 let currentRotationY = 0;
 let isDraggingCard = false;
 let startTouchX = 0;
 
 // SECURE PIPELINE METHOD: FileReader text-encoder reads picture data seamlessly on direct label input trigger events
 window.projectCameraToMesh = function(inputNode, isFrontMaterial) {
 try {
 if (inputNode.files && inputNode.files[0]) {
 const rawImageFile = inputNode.files[0];
 
 const encoder = new FileReader();
 encoder.onload = function(event) {
 try {
 const secureBase64String = event.target.result;
 
 if (isFrontMaterial) {
 // Projects image directly onto the large 3D canvas front face
 document.getElementById('front-3d-canvas').style.backgroundImage = `url('${secureBase64String}')`;
 document.getElementById('front-mini-view').innerHTML = `<img src="${secureBase64String}">`;
 const textNode = document.getElementById('front-txt-node'); if(textNode) textNode.remove();
 } else {
 // Projects image directly onto the large 3D canvas back face
 document.getElementById('back-3d-canvas').style.backgroundImage = `url('${secureBase64String}')`;
 document.getElementById('back-mini-view').innerHTML = `<img src="${secureBase64String}">`;
 const textNode = document.getElementById('back-txt-node'); if(textNode) textNode.remove();
 }
 } catch (renderErr) {
 console.error("Render error: " + renderErr.message);
 }
 };
 encoder.readAsDataURL(rawImageFile);
 }
 } catch (err) {
 console.error("Input processing error: " + err.message);
 }
 };

 // INTERACTIVE 3D TOUCH HANDLING ENGINE
 const touchStage = document.getElementById('interaction-3d-stage');
 const cardMesh = document.getElementById('live-3d-card-mesh');

 touchStage.addEventListener('touchstart', (e) => {
 isDraggingCard = true;
 startTouchX = e.touches[0].clientX;
 });

 touchStage.addEventListener('touchmove', (e) => {
 if (!isDraggingCard) return;
 const currentX = e.touches[0].clientX;
 const movementDeltaX = currentX - startTouchX;
 startTouchX = currentX;
 
 currentRotationY += movementDeltaX * 0.7;
 cardMesh.style.transform = `rotateY(${currentRotationY}deg)`;
 });

 touchStage.addEventListener('touchend', () => { isDraggingCard = false; });
 touchStage.addEventListener('touchcancel', () => { isDraggingCard = false; });
 </script>
</body>
</html>
