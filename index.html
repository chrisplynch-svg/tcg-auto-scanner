<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D SHOWCASE v5.3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1f3f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    .app-header {
      margin-top: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .app-title {
      color: #e6b800;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .app-version {
      color: #8fa3c7;
      font-size: 14px;
      font-weight: normal;
      text-transform: lowercase;
    }

    .scan-controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      margin-bottom: 40px;
    }

    .scan-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
    }

    .scan-btn {
      width: 100%;
      background: transparent;
      border: 2px solid #e6b800;
      color: #e6b800;
      padding: 12px 6px;
      font-weight: bold;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .preview-box {
      width: 85px;
      height: 120px;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    /* Optimization #1: Image layout handling for raw images */
    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Keeps full uncropped photo safe for future grading */
      background-color: #051329;
    }

    .preview-placeholder {
      font-size: 11px;
      color: #4a628a;
      text-align: center;
      line-height: 1.4;
    }

    .camera-trigger-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 45px;
      opacity: 0;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .mesh-view-stage {
      flex-grow: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      margin-bottom: 40px;
    }

    .card-3d-wrapper {
      width: 210px;
      height: 295px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.05s ease-out;
      cursor: grab;
      touch-action: none;
    }

    .card-side {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(25, 48, 84, 0.7), rgba(15, 32, 60, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* Optimization #1: Automatic Aspect-Ratio Clipping for 3D Mesh Card Face */
    .card-side img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Centers and slices extra table space seamlessly */
      border-radius: 14px;
    }

    .card-front {
      transform: rotateY(0deg);
    }

    .card-back {
      transform: rotateY(180deg);
    }

    /* Optimization #4: Neon Wireframe Placeholder Blueprints */
    .wireframe-blueprint {
      width: 85%;
      height: 85%;
      border: 1px dashed rgba(230, 184, 0, 0.25);
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .wireframe-blueprint::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 50%;
      border: 1px dashed rgba(230, 184, 0, 0.15);
      border-radius: 4px;
    }

    .wireframe-text {
      color: rgba(230, 184, 0, 0.4);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 60px;
      text-align: center;
      line-height: 1.4;
    }

    .instruction-overlay {
      width: 100%;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      margin-bottom: 25px;
      background-color: rgba(230, 184, 0, 0.02);
    }

    .instruction-text {
      color: #e6b800;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .bottom-action-anchor {
      width: 100%;
      margin-top: auto;
    }

    .evaluate-btn {
      width: 100%;
      background-color: #2ec4b6;
      border: none;
      color: #0b1f3f;
      padding: 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <h1 class="app-title">3D SHOWCASE <span class="app-version">v5.3</span></h1>
    </header>

    <section class="scan-controls-grid">
      <!-- Front Scan Stack -->
      <div class="scan-column">
        <button class="scan-btn">Scan Front</button>
        <input type="file" class="camera-trigger-overlay" accept="image/*" onchange="handleImageUpload(this, 'front')">
        <div class="preview-box" id="preview-front">
          <div class="preview-placeholder">Front<br>Preview</div>
        </div>
      </div>
      
      <!-- Back Scan Stack -->
      <div class="scan-column">
        <button class="scan-btn">Scan Back</button>
        <input type="file" class="camera-trigger-overlay" accept="image/*" onchange="handleImageUpload(this, 'back')">
        <div class="preview-box" id="preview-back">
          <div class="preview-placeholder">Back<br>Preview</div>
        </div>
      </div>
    </section>

    <main class="mesh-view-stage" id="mesh-stage">
      <div class="card-3d-wrapper" id="card-mesh">
        
        <!-- Upgraded Placeholder Front -->
        <div class="card-side card-front" id="mesh-front-side">
          <div class="wireframe-blueprint">
            <div class="wireframe-text">FRONT SIDE<br>PENDING</div>
          </div>
        </div>
        
        <!-- Upgraded Placeholder Back -->
        <div class="card-side card-back" id="mesh-back-side">
          <div class="wireframe-blueprint">
            <div class="wireframe-text">BACK SIDE<br>PENDING</div>
          </div>
        </div>
        
      </div>
    </main>

    <div class="instruction-overlay">
      <p class="instruction-text">Swipe card mesh area to spin in 3D</p>
    </div>

    <footer class="bottom-action-anchor">
      <button class="evaluate-btn">Evaluate 3D Showcase Blueprint</button>
    </footer>

  </div>

  <script>
    let currentRotationY = 0;
    let isDragging = false;
    let startX = 0;
    
    // Tracking markers for fluid haptic intervals
    let passedFrontFlip = false;
    let passedBackFlip = false;

    const cardMesh = document.getElementById('card-mesh');
    const meshStage = document.getElementById('mesh-stage');

    function handleImageUpload(input, side) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        
        reader.onload = function(e) {
          const imageSrc = e.target.result;
          
          const previewBox = document.getElementById(`preview-${side}`);
          if(previewBox) {
            previewBox.innerHTML = `<img src="${imageSrc}" alt="${side} preview">`;
          }
          
          const meshSide = document.getElementById(`mesh-${side}-side`);
          if(meshSide) {
            meshSide.innerHTML = `<img src="${imageSrc}" alt="${side} card surface">`;
          }
        };
        
        reader.readAsDataURL(file);
      }
    }

    function startDrag(e) {
      isDragging = true;
      startX = e.pageX || (e.touches && e.touches[0].pageX);
    }

    function moveDrag(e) {
      if (!isDragging) return;
      
      const currentX = e.pageX || (e.touches && e.touches[0].pageX);
      const deltaX = currentX - startX;
      
      currentRotationY += deltaX * 0.7;
      cardMesh.style.transform = `rotateY(${currentRotationY}deg)`;
      
      // Optimization #2: Calculate accurate angles to trigger native haptic ticks
      let normalizedAngle = Math.abs(currentRotationY % 360);
      
      // Check for 90-degree crossing point
      if (normalizedAngle > 80 && normalizedAngle < 100) {
        if (!passedFrontFlip) {
          triggerHapticFeedback();
          passedFrontFlip = true;
        }
      } else {
        passedFrontFlip = false;
      }

      // Check for 270-degree crossing point
      if (normalizedAngle > 260 && normalizedAngle < 280) {
        if (!passedBackFlip) {
          triggerHapticFeedback();
          passedBackFlip = true;
        }
      } else {
        passedBackFlip = false;
      }
      
      startX = currentX;
    }

    function endDrag() {
      isDragging = false;
    }

    // Helper engine checking permission status before attempting vibration pulses
    function triggerHapticFeedback() {
