<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PokeGradeZero</title>
  <style>
    /* ==========================================================================
       RESET & BASE VARIABLES
       ========================================================================== */
    :root {
      --bg-main: #0B132B;
      --bg-surface: #1C2541;
      --primary-teal: #4CC9F0;
      --accent-yellow: #FFCC00;
      --text-main: #FFFFFF;
      --text-muted: #A5A5A5;
      --tier-pull: #4BB543;
      --tier-cash: #FFCC00;
      --tier-binder: #FF3333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ==========================================================================
       WORKSPACE VIEWPORT CONTAINER
       ========================================================================== */
    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background-color: var(--bg-main);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 20;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .brand-title span {
      color: var(--primary-teal);
    }

    .reset-icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      font-size: 1.1rem;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
    }

    /* GENERAL ENGINE PANELS */
    .view-panel {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .view-panel.active {
      display: flex;
    }

    /* ==========================================================================
       VIEW 1: SCREEN NAVIGATION HUB
       ========================================================================== */
    .welcome-hero {
      margin: 25px 0;
      text-align: center;
    }

    .welcome-hero h2 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .welcome-hero p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .split-scanner-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .nav-routing-button {
      background-color: var(--bg-surface);
      border: 2px solid rgba(76, 201, 240, 0.2);
      border-radius: 16px;
      padding: 30px 12px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s, border-color 0.2s;
    }

    .nav-routing-button:active {
      transform: scale(0.96);
      border-color: var(--primary-teal);
    }

    .card-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .nav-routing-button h3 {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .nav-routing-button p {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* ==========================================================================
       VIEW 2: CLOSE-UP DUAL SCAN STAGE (Match Reference Mock)
       ========================================================================== */
    .capture-control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
    }

    .native-camera-label {
      position: relative;
      border: 2px solid var(--accent-yellow);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-yellow);
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .native-camera-label input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* Mini Thumbnail Previews Top Row */
    .mini-preview-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 25px;
    }

    .mini-box-preview {
      width: 75px;
      height: 105px;
      border: 2px dashed rgba(255, 204, 0, 0.4);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-align: center;
      overflow: hidden;
      background-color: rgba(28, 37, 65, 0.4);
    }

    .mini-box-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Centered 3D Interaction Wrapper */
    .stage-center-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 80px; /* Leave space for bottom peek drawer */
    }

    .scene-3d {
      width: 220px;
      height: 305px;
      perspective: 1000px;
      margin-bottom: 20px;
    }

    .card-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card-3d.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      background-color: var(--bg-surface);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .placeholder-canvas-text {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: rgba(255, 204, 0, 0.6);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 20px;
      text-transform: uppercase;
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .interaction-hint-border {
      width: 100%;
      border: 2px dashed var(--accent-yellow);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-yellow);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ==========================================================================
       VIEW 3: 9-CARD BINDER OVERVIEW STAGE
       ========================================================================== */
    .binder-header-actions {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }

    /* ==========================================================================
       SLIDE-UP DASHBOARD EXPANDABLE SYSTEM
       ========================================================================== */
    .slide-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      background: linear-gradient(to bottom, #16223F, #0E172A);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-top: 1px solid rgba(76, 201, 240, 0.3);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
      z-index: 30;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide-sheet.peek {
      transform: translateY(calc(100% - 60px));
    }

    .slide-sheet.expanded {
      transform: translateY(0);
    }

    .sheet-drag-handle {
      width: 40px;
      height: 5px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      margin: 12px auto;
      cursor: pointer;
    }

    .sheet-content {
      flex: 1;
      padding: 0 20px 20px 20px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header class="app-header">
      <h1 class="brand-title" id="nav-brand-home">PokeGrade<span>Zero</span></h1>
      <button id="master-reset-btn" class="reset-icon-btn" aria-label="Reset Application">🔄</button>
    </header>

    <!-- ==========================================
         VIEW 1: NAVIGATION HUB SCREEN
         ========================================== -->
    <main id="home-view" class="view-panel active">
      <div class="welcome-hero">
        <h2>High-Volume Sorting Blueprint</h2>
        <p>Select your zero-cost scanning workflow to begin.</p>
      </div>
      
      <div class="split-scanner-menu">
        <div class="nav-routing-button" id="route-to-closeup">
          <div class="card-icon">🔍</div>
          <h3>Close-Up Scanner</h3>
          <p>Deep-dive math evaluation for individual cards.</p>
        </div>

        <div class="nav-routing-button" id="route-to-binder">
          <div class="card-icon">📱</div>
          <h3>9-Card Page</h3>
          <p>Instant sorting tiers sequence layout mapping.</p>
        </div>
      </div>
    </main>

    <!-- ==========================================
         VIEW 2: CLOSE-UP SINGLE CARD SCANNING INTERFACE
         ========================================== -->
