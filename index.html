<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PokeGradeZero Prototype</title>
  <style>
    /* ==========================================================================
       RESET & BASE VARIABLES
       ========================================================================== */
    :root {
      --bg-main: #0B132B;
      --bg-surface: #1C2541;
      --primary-teal: #4CC9F0;
      --primary-blue: #3A0CA3;
      --accent-cyan: #72EFDD;
      --text-main: #FFFFFF;
      --text-muted: #A5A5A5;
      --tier-pull: #4BB543;
      --tier-cash: #FFCC00;
      --tier-binder: #FF3333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ==========================================================================
       MOBILE FRAME WORKSPACE
       ========================================================================== */
    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background-color: var(--bg-main);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-title span {
      color: var(--primary-teal);
    }

    .reset-icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      font-size: 1.1rem;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reset-icon-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    .view-panel {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .view-panel.active {
      display: flex;
    }

    /* ==========================================================================
       STEP 1: SPLIT SCANNERS
       ========================================================================== */
    .welcome-hero {
      margin: 15px 0 25px 0;
      text-align: center;
    }

    .welcome-hero h2 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .welcome-hero p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .split-scanner-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .scanner-card {
      background-color: var(--bg-surface);
      border: 2px dashed rgba(76, 201, 240, 0.2);
      border-radius: 16px;
      padding: 25px 12px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scanner-card:active {
      transform: scale(0.97);
      border-color: var(--primary-teal);
    }

    .native-camera-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
    }

    .card-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    .scanner-card h3 {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .scanner-card p {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* ==========================================================================
       STEP 2: INTERACTIVE 3D STAGE
       ========================================================================== */
    #stage-view {
      align-items: center;
      justify-content: center;
    }

    .scene-3d {
      width: 240px;
      height: 335px;
      perspective: 1000px;
      margin-bottom: 16px;
    }

    .card-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card-3d.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 14px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .card-front {
      background: linear-gradient(135deg, #2a2e3d 0%, #151821 100%);
    }

    .card-back {
      background: linear-gradient(135deg, #151821 0%, #2a2e3d 100%);
      transform: rotateY(180deg);
    }

    .placeholder-art {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
    }

    .interaction-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* ==========================================================================
       SLIDE-UP DASHBOARD PANEL
       ========================================================================== */
    .slide-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      background: linear-gradient(to bottom, #16223F, #0E172A);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-top: 1px solid rgba(76, 201, 240, 0.3);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
      z-index: 10;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide-sheet.peek {
      transform: translateY(calc(100% - 60px));
    }

    .slide-sheet.expanded {
      transform: translateY(0);
    }

    .sheet-drag-handle {
      width: 40px;
      height: 5px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      margin: 12px auto;
      cursor: pointer;
    }

    .sheet-content {
      flex: 1;
      padding: 0 20px 20px 20px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header class="app-header">
      <h1 class="brand-title">PokeGrade<span>Zero</span></h1>
      <button id="master-reset-btn" class="reset-icon-btn" aria-label="Reset UI">🔄</button>
    </header>

    <!-- VIEW 1: DUAL SCANNERS -->
    <main id="home-view" class="view-panel active">
      <div class="welcome-hero">
        <h2>High-Volume Sorting Blueprint</h2>
        <p>Select your zero-cost scanning workflow to begin.</p>
      </div>
      
      <div class="split-scanner-menu">
        <label class="scanner-card" id="btn-closeup">
          <input type="file" accept="image/*" class="native-camera-input" id="input-closeup">
          <div class="card-icon">🔍</div>
          <h3>Close-Up Scanner</h3>
          <p>Deep-dive math evaluation for individual cards.</p>
        </label>

        <label class="scanner-card" id="btn-binder">
          <input type="file" accept="image/*" class="native-camera-input" id="input-binder">
          <div class="card-icon">📱</div>
          <h3>9-Card Page</h3>
          <p>Instant sorting tiers sequence layout mapping.</p>
        </label>
      </div>
    </main>

    <!-- VIEW 2: INTERACTIVE CARD INTERFACE -->
    <section id="stage-view" class="view-panel">
      <div class="scene-3d">
        <div class="card-3d" id="interactive-card">
          <div class="card-face card-front">
            <div class="placeholder-art">📸 Tap to Flip Front</div>
          </div>
          <div class="card-face card-back">
            <div class="placeholder-art">🔮 Tap to Flip Back</div>
          </div>
        </div>
      </div>
      <p class="interaction-hint">Swipe or tap the card to flip</p>
    </section>

    <!-- BOTTOM SHEET OVERLAY PANEL -->
    <div id="dashboard-sheet" class="slide-sheet collapsed">
      <div class="sheet-drag-handle" id="sheet-handle"></div>
      <div class="sheet-content"></div>
    </div>
  </div>

  <script>

      const homeView = document.getElementById('home-view');
      const stageView = document.getElementById('stage-view');
      const inputCloseup = document.getElementById('input-closeup');

      const interactiveCard = document.getElementById('interactive-card');
      const dashboardSheet = document.getElementById('dashboard-sheet');
      const sheetContent = document.querySelector('.sheet-content');
