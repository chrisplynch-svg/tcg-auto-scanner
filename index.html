<!-- PokeGradeZero Deployment Script: Version 5.8 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PokeGradeZero v5.8</title>
  <style>
    :root {
      --bg-main: #0B1528;
      --bg-surface: #111F38;
      --bg-card: #15243F;
      --bg-mesh-box: #0F1C36;
      --bg-card-inner: #1B2D4A;
      --border-color: #1E325A;
      --border-accent: #23395B;
      --border-mesh: #2D4A77;
      --text-main: #FFFFFF;
      --text-muted: #A0AEC0;
      --text-dark: #718096;
      --color-gold: #FFCC00;
      --color-teal: #38B2AC;
      --color-green: #48BB78;
      --color-red: #F56565;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }

    .app-header {
      width: 100%;
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-main);
      margin-bottom: 25px;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .version-text {
      font-size: 14px;
      color: var(--color-gold);
    }

    .header-nav-box {
      display: flex;
      gap: 12px;
    }

    .header-icon-btn {
      background-color: var(--border-color);
      color: var(--text-main);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .screen-view {
      display: none;
      width: 100%;
    }

    .screen-view.active {
      display: block !important;
    }

    .home-content {
      margin-top: 30px;
      text-align: center;
      width: 100%;
    }

    .main-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .sub-title {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 40px;
    }

    .router-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 15px;
    }

    .router-card {
      background-color: var(--bg-card);
      width: 48%;
      border-radius: 12px;
      padding: 24px 16px;
      border: 1px solid var(--border-accent);
      cursor: pointer;
      text-align: center;
    }

    .router-card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .router-card-desc {
      color: var(--text-dark);
      font-size: 12px;
      line-height: 15px;
    }

    .section-title {
      color: var(--color-gold);
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
      text-align: center;
    }

    .scan-button-row {
      display: flex;
      width: 100%;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .scan-action-btn {
      width: 48%;
      border: 1.5px solid var(--color-gold);
      background: transparent;
      border-radius: 6px;
      padding: 12px 0;
      color: var(--color-gold);
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .preview-row {
      display: flex;
      width: 100%;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .preview-box {
      width: 48%;
      height: 120px;
      border: 2px dashed var(--color-gold);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-mesh-box);
    }

    .preview-text {
      color: var(--text-dark);
      font-size: 13px;
    }

    .mesh-container {
      width: 100%;
      height: 280px;
      background-color: var(--bg-surface);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid var(--border-color);
      perspective: 1000px;
    }

    .card-mesh-wrapper {
      width: 170px;
      height: 240px;
      background-color: var(--bg-card-inner);
      border: 1px solid var(--border-mesh);
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .mesh-card-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
    }

    .indicator-text-box {
      width: 100%;
      border: 1.5px dashed var(--color-gold);
      border-radius: 6px;
      padding: 10px 0;
      margin: 15px 0;
      background-color: var(--bg-mesh-box);
    }

    .indicator-text {
      color: var(--color-gold);
      text-align: center;
      font-size: 12px;
      font-weight: bold;
    }

    .submit-blueprint-btn {
      width: 100%;
      background-color: var(--color-teal);
      border: none;
      border-radius: 8px;
      padding: 14px 0;
      color: var(--bg-main);
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .full-page-scan-btn {
      width: 100%;
      background-color: var(--border-color);
      border: 1px solid var(--border-mesh);
      border-radius: 8px;
      padding: 14px 0;
      color: var(--text-main);
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .large-camera-placeholder {
      width: 100%;
      height: 200px;
      background-color: var(--bg-mesh-box);
      border-radius: 10px;
      border: 1px solid var(--border-accent);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .text-output-container {
      width: 100%;
      background-color: var(--bg-surface);
      border-radius: 10px;
      padding: 16px;
      border: 1px solid var(--border-color);
    }

    .output-heading {
      color: var(--color-gold);
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .list-text {
      font-family: monospace;
      font-size: 13px;
      margin: 6px 0;
    }

    .key-container {
      margin-top: 20px;
      border-top: 1px dashed var(--border-color);
      padding-top: 15px;
    }

    .key-heading {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .key-row {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 16px;
      margin-bottom: 8px;
    }

    .blueprint-main-header {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .blueprint-data-card {
      width: 100%;
      background-color: var(--bg-surface);
      border-radius: 10px;
      padding: 16px;
      border: 1px solid var(--border-color);
      margin-top: 15px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 13px;
    }

    .field-label { color: var(--text-muted); }
    .field-value { font-weight: 500; }
    .green-text { color: var(--color-green); font-weight: bold; }
    .gold-text { color: var(--color-gold); font-weight: bold; }
    .red-text { color: var(--color-red); }

    .divider {
      height: 1px;
      background-color: var(--border-color);
      margin: 12px 0;
    }

    .sub-box-title {
      color: var(--color-gold);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .total-container {
      margin: 12px 0;
      padding: 8px 0;
      border-top: 1px solid var(--border-mesh);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label { font-weight: bold; font-size: 13px; }
    .total-value { color: var(--color-green); font-weight: bold; font-size: 16px; }

    .save-history-btn {
      width: 100%;
      background-color: var(--color-teal);
      border: none;
      border-radius: 8px;
      padding: 14px 0;
      color: var(--bg-main);
      font-weight: bold;
      font-size: 13px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

    <header class="app-header">
      <div class="header-title">PokeGradeZero <span class="version-text">v5.8</span></div>
      <div class="header-nav-box">
        <button id="nav-btn-home" class="header-icon-btn" style="display:none;" onclick="navigateTo('home')">Home</button>
      </div>
    </header>

    <!-- SCREEN 1: HOME VIEW -->
    <div id="screen-home" class="screen-view active">
      <div class="home-content">
        <h1 class="main-title">High-Volume Sorting Blueprint</h1>
        <p class="sub-title">Select your zero-cost scanning workflow to begin.</p>
        
        <div class="router-row">
          <div class="router-card" onclick="navigateTo('closeup')">
            <div class="router-card-title">Close-Up</div>
            <div class="router-card-desc">Deep-dive math evaluation for individual cards.</div>
          </div>

          <div class="router-card" onclick="navigateTo('multiscan')">
            <div class="router-card-title">9-Card Page</div>
            <div class="router-card-desc">Instant sorting tiers sequence layout mapping.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: SCANNER CLOSE UP -->
    <div id="screen-closeup" class="screen-view">
      <h2 class="section-title">3D SHOWCASE</h2>
      
      <div class="scan-button-row">
        <button class="scan-action-btn">SCAN FRONT</button>
        <button class="scan-action-btn">SCAN BACK</button>
      </div>

      <div class="preview-row">
        <div class="preview-box"><span>Front Preview</span></div>
        <div class="preview-box"><span>Back Preview</span></div>
      </div>

      <div class="mesh-container">
