<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Card Grading v1.1</title>
    <!-- Light Tailwind styles optimized for mobile rendering engines -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { 
            background-color: #0B1528 !important; 
            color: #ffffff !important; 
            margin: 0; 
            padding: 16px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center">

    <div class="w-full max-w-[440px] text-center px-4">
        <!-- APP HEADER LAYER -->
        <header class="mb-12">
            <h1 class="text-2xl font-extrabold tracking-tight text-white">Trading Card Grading</h1>
            <p class="text-xs font-mono text-blue-400 mt-1.5 uppercase tracking-widest">v1.1</p>
        </header>

        <!-- SECURITY KEY STATUS INDICATOR -->
        <div class="bg-[#131F3B] border border-blue-900/40 p-4 rounded-xl text-left mb-8 shadow-inner">
            <label class="text-[11px] font-bold text-blue-400 block uppercase tracking-wide mb-1">🔑 System Key Status</label>
            <p class="text-xs text-gray-300 font-medium">Local vault active. Key configurations isolated.</p>
        </div>

        <!-- MAIN APP NAVIGATION ROUTERS -->
        <main class="w-full space-y-4">
            <!-- ROUTER 1: INDIVIDUAL CARD SCANNER -->
            <a href="closeup.html" class="block text-left bg-[#16223F] border border-blue-900/40 p-5 rounded-2xl active:scale-[0.98] transition-all shadow-md">
                <div class="text-base font-bold text-white flex items-center gap-2">🟢 Close-Up Scanner</div>
                <div class="text-xs text-gray-400 mt-1 leading-relaxed">Deep-dive math evaluation for individual cards.</div>
            </a>

            <!-- ROUTER 2: BINDER COMPOSITION MATRIX -->
            <a href="multiple.html" class="block text-left bg-[#16223F] border border-blue-900/40 p-5 rounded-2xl active:scale-[0.98] transition-all shadow-md">
                <div class="text-base font-bold text-white flex items-center gap-2">📑 9-Card Page</div>
                <div class="text-xs text-gray-400 mt-1 leading-relaxed">Instant sorting tiers & sequence layout mapping.</div>
            </a>
        </main>
    </div>

</body>
</html>
