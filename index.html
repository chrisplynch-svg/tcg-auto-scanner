<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Auto-Evaluator v5.1</title>
  <style>
    /* Reset & Theme Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1f3f; /* Dark Navy Background */
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      position: relative;
      padding-bottom: 80px; /* Space for the bottom fixed button */
    }

    /* Header Title */
    .app-header {
      margin-top: 10px;
      margin-bottom: 25px;
      text-align: center;
    }

    .app-title {
      color: #e6b800; /* Gold text */
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .app-version {
      color: #8fa3c7;
      font-size: 14px;
      font-weight: normal;
      text-transform: none;
      vertical-align: middle;
    }

    /* Top Row Layout for Scanning Controls */
    .scan-controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      margin-bottom: 30px;
    }

    .scan-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Buttons styled identically to your UI blueprint */
    .scan-btn {
      width: 100%;
      background: transparent;
      border: 2px solid #e6b800;
      color: #e6b800;
      padding: 12px 8px;
      font-weight: bold;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }

    .scan-btn:active {
      background: rgba(230, 184, 0, 0.1);
    }

    /* Small Preview Anchors below buttons */
    .preview-box {
      width: 75px;
      height: 105px;
      border: 2px dashed #e6b800;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.05);
      overflow: hidden;
      position: relative;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-placeholder {
      font-size: 10px;
      color: #5c7499;
      text-align: center;
      padding: 4px;
    }

    /* Interactive 3D Mesh Container Area */
    .mesh-view-stage {
      flex-grow: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px; /* Crucial for 3D depth perception */
      margin: 20px 0;
      min-height: 320px;
    }

    /* The 3D Card Parent structure */
    .card-3d-wrapper {
      width: 200px;
      height: 280px;
      position: relative;
      transform-style: preserve-3d;
      cursor: grab;
      touch-action: none; /* Prevents mobile scrolling when turning the card */
    }

    .card-3d-wrapper:active {
      cursor: grabbing;
    }

    /* Card Sides Styling */
    .card-side {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-side img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      border-radius: 10px;
    }

    .card-front {
      transform: rotateY(0deg);
    }

    .card-back {
      transform: rotateY(180deg);
    }

    /* Default Placeholder Content if images aren't scanned yet */
    .card-side-placeholder {
      color: #5c7499;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }

    /* Instructional Guidance Banner */
    .instruction-overlay {
      width: 100%;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .instruction-text {
      color: #e6b800;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Bottom Fixed Evaluation Action Bar */
    .bottom-action-anchor {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 418px;
      margin: 0 auto;
      z-index: 100;
    }

    .evaluate-btn {
      width: 100%;
      background-color: #2ec4b6; /* Teal / Turquoise color from your design */
      border: none;
      color: #0b1f3f;
      padding: 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(46, 196, 182, 0.3);
    }

    /* Hidden Hidden Inputs to trigger native device camera hardware */
    .hidden-camera-input {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Title Area -->
    <header class="app-header">
      <h1 class="app-title">3D Showcase <span class="app-version">v5.1</span></h1>
    </header>

    <!-- Scan Management Row -->
    <section class="scan-controls-grid">
      <div class="scan-column">
        <button class="scan-btn" onclick="triggerCamera('front')">Scan Front</button>
        <div class="preview-box" id="preview-front">
          <div class="preview-placeholder">Front Preview</div>
        </div>
      </div>
      
      <div class="scan-column">
        <button class="scan-btn" onclick="triggerCamera('back')">Scan Back</button>
        <div class="preview-box" id="preview-back">
          <div class="preview-placeholder">Back Preview</div>
        </div>
      </div>
    </section>

    <!-- Native Camera Hooks -->
    <input type="file" id="input-front" class="hidden-camera-input" accept="image/*" capture="environment" onchange="handleImageUpload(this, 'front')">
    <input type="file" id="input-back" class="hidden-camera-input" accept="image/*" capture="environment" onchange="handleImageUpload(this, 'back')">

    <!-- Interactive 3D Spinning Mesh Stage -->
    <main class="mesh-view-stage" id="mesh-stage">
      <div class="card-3d-wrapper" id="card-mesh">
        
        <!-- Front Surface of Card -->
        <div class="card-side card-front" id="mesh-front-side">
          <div class="card-side-placeholder">Scan Front to View Image</div>
        </div>
        
        <!-- Back Surface of Card -->
        <div class="card-side card-back" id="mesh-back-side">
          <div class="card-side-placeholder">Scan Back to View Image</div>
        </div>
        
      </div>
    </main>

    <!-- UI Overlay Guides -->
    <div class="instruction-overlay">
      <p class="instruction-text">Swipe card mesh area to spin in 3D</p>
    </div>

    <!-- Pricing/Expansion Pivot -->
    <footer class="bottom-action-anchor">
      <button class="evaluate-btn" onclick="handleEvaluationClick()">Evaluate 3D Showcase Blueprint</button>
    </footer>

  </div>

  <script>
    // State management variables
    let currentRotationY = 0;
    let isDragging = false;
    let startX = 0;

    const cardMesh = document.getElementById('card-mesh');
    const meshStage = document.getElementById('mesh-stage');

    // Open native camera app depending on button clicked
    function triggerCamera(side) {
      document.getElementById(`input-${side}`).click();
    }

    // Capture photo data, update preview windows, and populate 3D structure card faces
    function handleImageUpload(input, side) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        
        reader.onload = function(e) {
          const imageSrc = e.target.result;
          
          // 1. Update the small preview node box
          const previewBox = document.getElementById(`preview-${side}`);
          previewBox.innerHTML = `<img src="${imageSrc}" alt="${side} preview">`;
          
          // 2. Map image to corresponding face layout inside 3D environment wrapper
          const meshSide = document.getElementById(`mesh-${side}-side`);
          meshSide.innerHTML = `<img src="${imageSrc}" alt="${side} card face">`;
        };
        
        reader.readAsDataURL(input.files[0]);
      }
    }

    // Handle touch interactions to drag/spin the mesh card
    function startDrag(e) {
      isDragging = true;
      startX = e.pageX || e.touches[0].pageX;
    }

    function moveDrag(e) {
      if (!isDragging) return;
      
      const currentX = e.pageX || e.touches[0].pageX;
      const deltaX = currentX - startX;
      
      // Calculate rotation adjustments dynamically based on user movement distance
      currentRotationY += deltaX * 0.6;
      cardMesh.style.transform = `rotateY(${currentRotationY}deg)`;
      
      startX = currentX; // Reset base tracking position
    }

    function endDrag() {
      isDragging = false;
    }

    // Set up touch and mouse drag rotation event bindings
    meshStage.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    meshStage.addEventListener('touchstart', startDrag, { passive: true });
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('touchend', endDrag);
