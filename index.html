<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TCG EVALUATOR v6.0</title>
  <style>
    /* Reset & Theme Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1f3f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      position: relative;
    }

    /* Screen Views Management */
    .view-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    .hidden-view {
      display: none !important;
    }

    .app-header {
      margin-top: 5px;
      margin-bottom: 20px;
      text-align: center;
    }

    .app-title {
      color: #e6b800;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .app-version {
      color: #8fa3c7;
      font-size: 14px;
      font-weight: normal;
      text-transform: lowercase;
    }

    /* Scanner Grid Layout Optimization */
    .scan-controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      margin-bottom: 25px;
    }

    .scan-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* v6.0 Airtight Strategy: The Input is completely hidden, but the Label IS the button */
    .native-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* Styled Label that behaves natively to trigger camera roll directly */
    .scan-trigger-label {
      display: block;
      width: 100%;
      background: linear-gradient(180deg, #18335c 0%, #0a1b35 100%);
      border: 2px solid #e6b800;
      color: #e6b800;
      padding: 14px 6px;
      font-weight: 800;
      font-size: 13px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 12px rgba(230, 184, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      text-align: center;
      cursor: pointer;
      transition: transform 0.05s ease;
    }

    .scan-trigger-label:active {
      transform: scale(0.96);
      background: linear-gradient(180deg, #0a1b35 0%, #040e1d 100%);
      box-shadow: 0 0 4px rgba(230, 184, 0, 0.15);
    }

    /* Scaled Sizing Preview Anchors */
    .preview-box {
      width: 100px;
      height: 140px;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-placeholder {
      font-size: 11px;
      color: #4a628a;
      text-align: center;
      line-height: 1.4;
      font-weight: bold;
      text-transform: uppercase;
    }

    /* Large Dual Vertically Stacked Presentation Engine */
    .stacked-cards-stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-bottom: 110px; 
    }

    .flat-card-container {
      width: 250px;
      height: 350px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(25, 48, 84, 0.7), rgba(15, 32, 60, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .flat-card-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
    }

    /* Glowing Placeholder Outlines */
    .wireframe-blueprint {
      width: 85%;
      height: 85%;
      border: 1px dashed rgba(230, 184, 0, 0.25);
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .wireframe-blueprint::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 50%;
      border: 1px dashed rgba(230, 184, 0, 0.15);
      border-radius: 4px;
    }

    .wireframe-text {
      color: rgba(230, 184, 0, 0.4);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 75px;
      text-align: center;
      line-height: 1.4;
    }

    /* Fixed Teal Bottom Panel Anchor Layout */
    .bottom-action-anchor {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    .evaluate-btn {
      width: 100%;
      max-width: 420px;
      background-color: #2ec4b6;
      border: none;
      color: #0b1f3f;
      padding: 18px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -4px 20px rgba(46, 196, 182, 0.25);
    }

    /* Evaluation Metric Content Dashboard */
    .dashboard-panel-content {
      width: 100%;
      background-color: #0b1f3f;
      display: flex;
      flex-direction: column;
      padding-top: 10px;
      padding-bottom: 85px;
    }

    .metric-group {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .metric-group-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #2ec4b6;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(46, 196, 182, 0.15);
      padding-bottom: 4px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }

    .metric-label {
      color: #a4b8da;
    }

    .metric-value {
      font-weight: bold;
    }

    .metric-value.green { color: #2ecc71; }
    .metric-value.yellow { color: #f1c40f; }

    .math-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 12px;
    }

    .math-row.deduction {
      color: #e74c3c;
    }
    
    .math-row.payout-total {
      margin-top: 10px;
      border-top: 1px dashed rgba(255,255,255,0.2);
      padding-top: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #2ecc71;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- DISPLAY CONTEXT LAYER 1: MAIN SCANNER SCREEN -->
    <div id="screen-showcase" class="view-screen">
      <header class="app-header">
        <h1 class="app-title">TCG EVALUATOR <span class="app-version">v6.0</span></h1>
      </header>

      <section class="scan-controls-grid">
        <!-- Front Scan Setup -->
        <div class="scan-column">
          <!-- Hidden Native Input element with linked ID anchor mapping -->
          <input type="file" id="input-front" class="native-file-input" accept="image/*">
          <!-- Label linked via 'for' attribute behaves perfectly to launch camera roll securely -->
          <label for="input-front" class="scan-trigger-label">Scan Front</label>
          <div class="preview-box" id="preview-front">
            <div class="preview-placeholder">Front<br>Preview</div>
          </div>
        </div>
        
        <!-- Back Scan Setup -->
        <div class="scan-column">
          <!-- Hidden Native Input element with linked ID anchor mapping -->
          <input type="file" id="input-back" class="native-file-input" accept="image/*">
          <!-- Label linked via 'for' attribute behaves perfectly to launch camera roll securely -->
          <label for="input-back" class="scan-trigger-label">Scan Back</label>
          <div class="preview-box" id="preview-back">
            <div class="preview-placeholder">Back<br>Preview</div>
          </div>
        </div>
      </section>

      <main class="stacked-cards-stage">
        <div class="flat-card-container" id="mesh-front-side">
          <div class="wireframe-blueprint">
            <div class="wireframe-text">FRONT CARD FACE<br>PENDING SCAN</div>
          </div>
        </div>
        
        <div class="flat-card-container" id="mesh-back-side">
          <div class="wireframe-blueprint">
            <div class="wireframe-text">BACK CARD FACE<br>PENDING SCAN</div>
          </div>
        </div>
      </main>
    </div>

    <!-- DISPLAY CONTEXT LAYER 2: METRICS DASHBOARD VIEW -->
    <div id="screen-dashboard" class="view-screen hidden-view">
      <header class="app-header">
        <h1 class="app-title">EVALUATION METRICS</h1>
      </header>
      
      <div class="dashboard-panel-content">
        <div class="metric-group">
          <div class="metric-group-title">📊 Deep-Dive Pre-Grading Blueprint</div>
          <div class="metric-row">
            <span class="metric-label">Estimated Grade:</span>
            <span class="metric-value yellow">PSA 9 (Mint)</span>
          </div>
          <div class="metric-row">
