<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D SHOWCASE v5.6</title>
  <style>
    /* Reset & Theme Foundations */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1f3f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    .app-header {
      margin-top: 10px;
      margin-bottom: 25px;
      text-align: center;
    }

    .app-title {
      color: #e6b800;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .app-version {
      color: #8fa3c7;
      font-size: 14px;
      font-weight: normal;
      text-transform: lowercase;
    }

    /* Top Row Layout for Controls */
    .scan-controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      margin-bottom: 30px;
    }

    .scan-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
    }

    /* Fixed v5.6 Premium Metallic Styling (No Icons) */
    .scan-btn {
      width: 100%;
      background: linear-gradient(180deg, #18335c 0%, #0a1b35 100%);
      border: 2px solid #e6b800;
      color: #e6b800;
      padding: 14px 6px;
      font-weight: 800;
      font-size: 13px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 12px rgba(230, 184, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      text-align: center;
      pointer-events: none; /* Let clicks pass directly down to the camera overlay trigger */
    }

    /* Fixed Stacking: Transparent camera link rests cleanly on top */
    .camera-trigger-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 47px;
      opacity: 0;
      cursor: pointer;
      -webkit-appearance: none;
      z-index: 10;
    }

    /* Trigger active pressed mechanics beautifully on the sibling button container */
    .camera-trigger-overlay:active + .scan-btn {
      transform: scale(0.96);
      background: linear-gradient(180deg, #0a1b35 0%, #040e1d 100%);
      box-shadow: 0 0 4px rgba(230, 184, 0, 0.15);
    }

    .preview-box {
      width: 85px;
      height: 120px;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-placeholder {
      font-size: 11px;
      color: #4a628a;
      text-align: center;
      line-height: 1.4;
    }

    /* Center 3D Interactive Stage Canvas Layout */
    .mesh-view-stage {
      flex-grow: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      margin-bottom: 30px;
      min-height: 310px;
    }

    .card-3d-wrapper {
      width: 210px;
      height: 295px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      cursor: grab;
      touch-action: none;
    }

    .card-side {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(25, 48, 84, 0.7), rgba(15, 32, 60, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .card-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }

    .card-front {
      transform: rotateY(0deg);
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .wireframe-blueprint {
      width: 85%;
      height: 85%;
      border: 1px dashed rgba(230, 184, 0, 0.25);
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .wireframe-blueprint::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 50%;
      border: 1px dashed rgba(230, 184, 0, 0.15);
      border-radius: 4px;
    }

    .wireframe-text {
      color: rgba(230, 184, 0, 0.4);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 60px;
      text-align: center;
      line-height: 1.4;
    }

    .instruction-overlay {
      width: 100%;
      border: 2px dashed #e6b800;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      margin-bottom: 95px; /* Give breathing space above footer anchor layout */
      background-color: rgba(230, 184, 0, 0.02);
    }

    .instruction-text {
      color: #e6b800;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Fixed Teal Bottom Pivot Interface */
    .bottom-action-anchor {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }

    .evaluate-btn {
      width: 100%;
      max-width: 400px;
      background-color: #2ec4b6;
      border: none;
      color: #0b1f3f;
      padding: 18px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -4px 20px rgba(46, 196, 182, 0.25);
    }

    /* v5.6 Slidable Evaluation Metrics Panel Engine Overlay */
    .sliding-evaluation-panel {
      width: 100%;
      max-width: 400px;
      background-color: #08162e;
      border-top: 2px solid #2ec4b6;
      height: 0; /* Animated dynamically open to 520px via script methods */
      overflow-y: auto;
      transition: height 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
      display: flex;
      flex-direction: column;
      padding: 0 16px;
    }

    .panel-open {
      height: 520px;
      padding: 20px 16px 40px 16px;
    }

    /* Evaluation Blocks Dashboard Structure styling */
    .metric-group {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .metric-group-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #2ec4b6;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(46, 196, 182, 0.15);
      padding-bottom: 4px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }

    .metric-label {
      color: #a4b8da;
    }

    .metric-value {
      font-weight: bold;
    }

    .metric-value.green { color: #2ecc71; }
    .metric-value.yellow { color: #f1c40f; }
    .metric-value.red { color: #e74c3c; }

    /* Net Profit Calculation Table Blocks Specific Formatting */
    .math-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 12px;
    }

    .math-row.deduction {
      color: #e74c3c;
    }
    
    .math-row.payout-total {
      margin-top: 10px;
      border-top: 1px dashed rgba(255,255,255,0.2);
      padding-top: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #2ecc71;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <h1 class="app-title">3D SHOWCASE <span class="app-version">v5.6</span></h1>
    </header>

    <section class="scan-controls-grid">
      <!-- Front Scan Configuration Anchor -->
      <div class="scan-column">
        <input type="file" class="camera-trigger-overlay" accept="image/*" onchange="handleImageUpload(this, 'front')">
        <button class="scan-btn">Scan Front</button>
        <div class="preview-box" id="preview-front">
          <div class="preview-placeholder">Front<br>Preview</div>
        </div>
      </div>
      
      <!-- Back Scan Configuration Anchor -->
      <div class="scan-column">
        <input type="file" class="camera-trigger-overlay" accept="image/*" onchange="handleImageUpload(this, 'back')">
        <button class="scan-btn">Scan Back</button>
        <div class="preview-box" id="preview-back">
          <div class="preview-placeholder">Back<br>Preview</div>
        </div>
      </div>
    </section>

    <main class="mesh-view-stage" id="mesh-stage">
      <div class="card-3d-wrapper" id="card-mesh">
        
        <div class="card-side card-front" id="mesh-front-side">
          <div class="wireframe-blueprint">
            <div class="wireframe-text">FRONT SIDE<br>PENDING</div>
          </div>
        </div>
        
        <div class="card-side card-back" id="mesh-back-side">
          <div class="wireframe-blueprint">
            <div class="wireframe-text">BACK SIDE<br>PENDING</div>
          </div>
        </div>
        
      </div>
    </main>
