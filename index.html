<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Card Grading v1.1</title>
    <style>
        /* High-performance pure CSS matching your exact dark blue environment theme */
        body { 
            background-color: #0B1528 !important; 
            color: #ffffff !important; 
            margin: 0; 
            padding: 24px 16px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .app-container {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        header {
            margin-bottom: 40px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .version {
            font-size: 11px;
            font-family: monospace;
            color: #60A5FA;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .status-box {
            background-color: #131F3B;
            border: 1px solid rgba(30, 58, 138, 0.4);
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            margin-bottom: 32px;
        }
        .status-label {
            font-size: 11px;
            font-weight: 700;
            color: #60A5FA;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 8px;
        }
        .vault-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }
        .vault-input {
            background-color: #0F1A30;
            border: 1px solid rgba(30, 58, 138, 0.6);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: #ffffff;
            font-family: monospace;
            flex-1: 1;
            width: 65%;
        }
        .vault-input:focus {
            outline: none;
            border-color: #2563EB;
        }
        .vault-btn {
            background-color: #10B981;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .vault-btn:active {
            transform: scale(0.95);
        }
        .status-text {
            font-size: 11px;
            color: #9CA3AF;
            margin: 4px 0 0 0;
            font-weight: 500;
        }
        .menu-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .router-card {
            display: block;
            text-align: left;
            background-color: #16223F;
            border: 1px solid rgba(30, 58, 138, 0.4);
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            transition: transform 0.1s ease;
        }
        .router-card:active {
            transform: scale(0.98);
        }
        .router-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }
        .router-desc {
            font-size: 12px;
            color: #9CA3AF;
            margin-top: 6px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header>
            <h1>Trading Card Grading</h1>
            <div class="version">v1.1</div>
        </header>

        <!-- SECURITY VAULT STATE CONFIG -->
        <div class="status-box">
            <span class="status-label">🔑 System Vault Configuration</span>
            <div class="vault-input-group">
                <input type="password" id="key-vault" placeholder="Paste AQ.Ab8RN... Key Here" class="vault-input">
                <button onclick="lockKey()" class="vault-btn">Save</button>
            </div>
            <p id="key-status" class="status-text">Checking local browser memory banks...</p>
        </div>

        <!-- APP ROUTERS -->
        <nav class="menu-stack">
            <a href="closeup.html" class="router-card">
                <div class="router-title">🟢 Close-Up Scanner</div>
                <div class="router-desc">Deep-dive math evaluation for individual cards.</div>
            </a>

            <a href="multiple.html" class="router-card">
                <div class="router-title">📑 9-Card Page</div>
                <div class="router-desc">Instant sorting tiers & sequence layout mapping.</div>
            </a>
        </nav>
    </div>

    <script>
        const keyName = 'tcg_auto_scanner_gemini_key';
        
        // Initializing verification scripts on app launch
        window.addEventListener('load', () => {
            const cachedKey = localStorage.getItem(keyName);
            if (cachedKey) {
                document.getElementById('key-vault').value = cachedKey;
                updateStatus(true);
            } else { 
                updateStatus(false); 
            }
        });

        function lockKey() {
            const val = document.getElementById('key-vault').value.trim();
            if (val) { 
                localStorage.setItem(keyName, val); 
                updateStatus(true); 
            } else { 
                localStorage.removeItem(keyName); 
                updateStatus(false); 
            }
        }

        function updateStatus(active) {
            const el = document.getElementById('key-status');
            if (el) {
                if (active) { 
                    el.textContent = "🟢 Key loaded securely on your iPhone."; 
                    el.style.color = "#34D399";
                } else { 
                    el.textContent = "🔴 Key missing. Information slots will load simulation fallbacks."; 
                    el.style.color = "#F59E0B";
                }
            }
        }
    </script>
</body>
</html>
